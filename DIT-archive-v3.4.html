function renderStep1(){
  calcDays();
  const daysBadge=formData.totalDays?`<div class="days-badge">총 ${formData.totalDays}일</div>`:'';
  const emojiGrid=COVER_EMOJIS.map(e=>`<button class="eg-btn${formData.coverEmoji===e?' on':''}" onclick="formData.coverEmoji='${e}';document.querySelectorAll('.eg-btn').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${e}</button>`).join('');
  return `<div class="wiz-wrap">
    <div class="wiz-headline">언제 다녀왔어요?</div>
    <div class="wiz-sub">기간과 이름을 입력하면 날짜별 기록을 만들어드려요.</div>
    <span class="wiz-label">여행 기간</span>
    <div class="date-row">
      <input type="date" value="${formData.startDate}" onchange="formData.startDate=this.value;calcDays();const d=document.querySelector('.days-badge');if(d)d.textContent=formData.totalDays?'총 '+formData.totalDays+'일':'';">
      <input type="date" value="${formData.endDate}" onchange="formData.endDate=this.value;calcDays();const d=document.querySelector('.days-badge');if(d)d.textContent=formData.totalDays?'총 '+formData.totalDays+'일':'';">
    </div>
    ${daysBadge}
    <span class="wiz-label">여행 이름</span>
    <input class="wiz-inp" value="${esc(formData.title)}" placeholder="예: 남미 21일 여행" oninput="formData.title=this.value">
    <span class="wiz-label">커버 이모지</span>
    <div class="emoji-grid" style="margin-bottom:1rem">${emojiGrid}</div>
    <div class="wiz-footer">
      <button class="wiz-prev" onclick="closeForm()">취소</button>
      <button class="wiz-next" onclick="goToTimeline()">날짜별 기록 →</button>
    </div>
  </div>`;
}
function goToTimeline(){
  if(!formData.startDate||!formData.endDate){showToast("날짜를 설정해요.");return;}
  if(!formData.title.trim()){showToast("여행 이름을 입력해요.");return;}
  calcDays();
  if(!formData.tripDays||!formData.tripDays.length){
    formData.tripDays=[];
    const start=new Date(formData.startDate);
    for(let i=0;i<formData.totalDays;i++){
      const d=new Date(start);d.setDate(start.getDate()+i);
      formData.tripDays.push({dayNum:i+1,date:d.toISOString().slice(0,10),locationCode:'',locationName:'',locationEmoji:'',locationType:'country',parentCode:null,parentName:null,parentEmoji:null,memo:'',moods:[],score:null,photos:[]});
    }
  }
  formStep=2;activeDayIdx=0;renderForm();
}
function renderStep2(){
  const days=formData.tripDays||[];
  const usedLocs=[...new Map(days.filter(d=>d.locationCode).map(d=>[d.locationCode,d])).values()].slice(0,5);
  const dayRows=days.map((d,i)=>{
    const isActive=i===activeDayIdx;
    const locLabel=d.locationCode?(d.locationType==='city'&&d.parentEmoji?`${d.parentEmoji} ${d.locationName}`:`${d.locationEmoji} ${d.locationName}`):'위치 추가';
    const locClass=d.locationCode?'':'empty';
    const moodChips=ALL_MOODS.map(m=>`<button class="mood-chip${(d.moods||[]).includes(m)?' on':''}" onclick="event.stopPropagation();toggleDayMood(${i},'${m}')">${m}</button>`).join('');
    const photoGrid=(d.photos||[]).length?`<div class="photo-preview-grid" style="margin-bottom:.5rem">${d.photos.map((p,pi)=>`<div class="photo-preview-item"><img src="${p}" alt=""><button class="photo-del-btn" onclick="event.stopPropagation();removeDayPhoto(${i},${pi})">${IC.xMark}</button></div>`).join('')}</div>`:'';
    const usedChips=usedLocs.filter(l=>l.locationCode!==d.locationCode).map(l=>`<div class="loc-chip used" onclick="setDayLoc(${i},${JSON.stringify({code:l.locationCode,name:l.locationName,emoji:l.locationEmoji,type:l.locationType,parentCode:l.parentCode,parentName:l.parentName,parentEmoji:l.parentEmoji}).replace(/"/g,'&quot;')})">${l.locationType==='city'&&l.parentEmoji?l.parentEmoji:l.locationEmoji} ${l.locationName}</div>`).join('');
    const editPanel=isActive?`
      <div class="tl-edit-panel" onclick="event.stopPropagation()">
        <div class="cs-wrap" style="margin-bottom:.5rem"><input class="cs-inp" placeholder="나라 또는 도시 검색..." oninput="showDayLocAC(this.value,${i})" autocomplete="off" value="${d.locationCode?esc(locLabel):''}"><div class="cs-dd" id="day-dd-${i}"></div></div>
        ${usedChips?`<div class="loc-suggest">${usedChips}</div>`:''}
        <span class="wiz-label" style="margin-top:.75rem">기분</span>
        <div class="mood-grid" style="margin-bottom:.75rem">${moodChips}</div>
        <span class="wiz-label">메모</span>
        <textarea class="day-textarea" placeholder="그날의 기억..." oninput="formData.tripDays[${i}].memo=this.value" style="margin-bottom:.75rem">${esc(d.memo||'')}</textarea>
        <span class="wiz-label">사진 <span style="font-weight:400;color:var(--ink-muted)">${(d.photos||[]).length}/10장</span></span>
        ${photoGrid}
        <div class="photo-zone" style="margin-bottom:0" onclick="document.getElementById('tdp-${i}').click()">
          <input type="file" id="tdp-${i}" accept="image/*" multiple style="display:none" onchange="addDayPhotos(${i},this.files)">
          <div class="pz-icon">${IC.camera}</div>
          <div class="pz-text"><strong>사진 추가</strong></div>
        </div>
      </div>`:'';
    return `<div class="tl-day-row" onclick="activeDayIdx=${i};renderForm()">
      <div class="tl-day-left">
        <div class="tl-day-num${d.locationCode?' filled':''}${isActive?' active':''}">${d.dayNum}</div>
        <div class="tl-day-date">${d.date?d.date.slice(5).replace('-','.'):'--.-'}</div>
      </div>
      <div class="tl-day-card${isActive?' active':''}${!d.locationCode?' empty':''}">
        <div class="tl-day-top">
          <span class="tl-day-loc ${locClass}">${locLabel}</span>
          ${d.moods?.length?`<span style="font-size:var(--fs-xs);color:var(--ink-muted)">${d.moods.slice(0,2).join(' ')}</span>`:''}
        </div>
        ${d.memo&&!isActive?`<div class="tl-day-memo">${esc(d.memo)}</div>`:''}
        ${(d.photos||[]).length&&!isActive?`<div class="tl-day-photos">${d.photos.slice(0,3).map(p=>`<img class="tl-day-thumb" src="${p}" alt="">`).join('')}</div>`:''}
        ${editPanel}
      </div>
    </div>`;
  }).join('');
  const delBtn=editingId?`<button onclick="deleteTrip('${editingId}')" style="width:100%;padding:.65rem;background:transparent;border:1.5px solid var(--error);border-radius:var(--r-sm);color:var(--error);font-size:var(--fs-sm);font-weight:600;cursor:pointer;margin-top:.5rem">이 여행 기록 삭제</button>`:'';
  return `<div class="wiz-wrap">
    <div class="wiz-headline" style="font-size:var(--fs-xl)">날짜별 기록</div>
    <div class="wiz-sub" style="margin-bottom:1rem">${formData.tripDays.length}일 · 각 날짜를 탭해서 기록해요</div>
    <div class="tl-form-list">${dayRows}</div>
    ${delBtn}
    <div class="wiz-footer">
      <button class="wiz-prev" onclick="formStep=1;renderForm()">←</button>
      <button class="wiz-next" onclick="saveTrip()">저장</button>
    </div>
  </div>`;
}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function calcDays(){if(formData.startDate&&formData.endDate)formData.totalDays=Math.max(1,Math.ceil((new Date(formData.endDate)-new Date(formData.startDate))/86400000)+1);}
function showDayLocAC(q,idx){
  const dd=document.getElementById('day-dd-'+idx);if(!dd)return;
  if(!q){dd.style.display='none';return;}
  const cRes=COUNTRIES.filter(c=>c.name.includes(q)||c.code.toLowerCase()===q.toLowerCase()).slice(0,4);
  const cityRes=CITIES.filter(c=>c.name.includes(q)).slice(0,4);
  let html='';
  html+=cRes.map(c=>`<div class="cs-item" onclick="setDayLoc(${idx},${JSON.stringify(c).replace(/"/g,'&quot;')})">${c.emoji} <span>${c.name}</span></div>`).join('');
  html+=cityRes.map(c=>`<div class="cs-item" onclick="setDayLoc(${idx},${JSON.stringify(c).replace(/"/g,'&quot;')})">${c.parentEmoji} <span>${c.name} <span style="color:var(--ink-muted);font-size:var(--fs-sm)">· ${c.parentName}</span></span></div>`).join('');
  if(!html)html=`<div class="cs-item" onclick="setDayLoc(${idx},{code:'LOC_'+Date.now(),name:'${q.replace(/'/g,'')}',emoji:'📍',type:'city'})">📍 <span>"${q}" 직접 추가</span></div>`;
  dd.innerHTML=html;dd.style.display='block';
}
function setDayLoc(idx,loc){
  const d=formData.tripDays[idx];if(!d)return;
  d.locationCode=loc.code;d.locationName=loc.name;d.locationEmoji=loc.emoji||'📍';
  d.locationType=loc.type||'country';d.parentCode=loc.parentCode||null;
  d.parentName=loc.parentName||null;d.parentEmoji=loc.parentEmoji||null;
  const dd=document.getElementById('day-dd-'+idx);if(dd)dd.style.display='none';
  renderForm();
}
function toggleDayMood(idx,m){
  const d=formData.tripDays[idx];if(!d)return;
  if(!d.moods)d.moods=[];
  const i=d.moods.indexOf(m);
  if(i>=0)d.moods.splice(i,1);else d.moods.push(m);
  renderForm();
}
async function addDayPhotos(idx,files){
  const d=formData.tripDays[idx];if(!d)return;
  if(!d.photos)d.photos=[];
  const rem=10-d.photos.length;if(rem<=0){showToast("하루에 최대 10장까지 가능해요");return;}
  showToast("사진 압축 중...");
  for(const file of [...files].slice(0,rem))d.photos.push(await compressImage(file,800,.75));
  renderForm();showToast("사진 추가됐어요!");
}
function removeDayPhoto(idx,pi){formData.tripDays[idx]?.photos?.splice(pi,1);renderForm();}
async function saveTrip(){
  if(!formData.tripDays||!formData.tripDays.length){showToast("날짜별 기록을 추가해요.");return;}
  if(!formData.startDate||!formData.endDate){showToast("날짜를 설정해요.");return;}
  if(!formData.title.trim()){
    const locs=[...new Set(formData.tripDays.filter(d=>d.locationCode).map(d=>d.locationName))];
    formData.title=(locs.slice(0,2).join('·')||'여행')+' '+formData.startDate.slice(0,4);
  }
  calcDays();
  const id=editingId||Date.now()+'_'+Math.random().toString(36).slice(2,5);
  const trip={id,status:formData.status,title:formData.title.trim(),coverEmoji:formData.coverEmoji,startDate:formData.startDate,endDate:formData.endDate,totalDays:formData.totalDays||0,tripDays:formData.tripDays,
    createdAt:editingId?(trips.find(t=>t.id===id)?.createdAt||new Date().toISOString()):new Date().toISOString(),
    updatedAt:new Date().toISOString()};
  trips=editingId?trips.map(t=>t.id===id?trip:t):[trip,...trips];
  await saveToFirestore(trip);renderAll();closeForm();showToast("저장됐어요!");
}
async function deleteTrip(id){if(!confirm("이 여행 기록을 삭제하시겠어요?"))return;trips=trips.filter(t=>t.id!==id);await delFromFirestore(id);renderAll();closeForm();showToast("삭제됐어요.");}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500);}
document.addEventListener("click",e=>{if(!e.target.closest(".cs-wrap"))document.querySelectorAll(".cs-dd").forEach(d=>d.style.display="none");});

// ── GLOBE ANIMATION ──
(function(){
  const lons=[0,1,2,3,4,5].map(i=>document.getElementById("lon"+i));
  const offsets=lons.map((_,i)=>i*Math.PI/6);
  const R=240,speed=0.004;let angle=0,rafId=null;
  const BLOBS=[{hx:440,hy:180,gx:330,gy:218,rx:[56,44,50,58],ry:[44,52,40,46],ph:0,delay:0},{hx:365,hy:168,gx:292,gy:232,rx:[28,34,24,30],ry:[22,18,26,24],ph:.9,delay:150},{hx:258,hy:162,gx:268,gy:228,rx:[42,36,46,40],ry:[34,40,30,36],ph:1.8,delay:280},{hx:155,hy:185,gx:272,gy:260,rx:[32,26,36,30],ry:[26,32,22,28],ph:2.7,delay:430},{hx:170,hy:295,gx:284,gy:270,rx:[24,28,20,26],ry:[20,16,24,22],ph:3.6,delay:90},{hx:300,hy:285,gx:308,gy:245,rx:[28,24,32,26],ry:[23,28,20,25],ph:4.5,delay:350},{hx:468,hy:345,gx:322,gy:255,rx:[22,18,26,20],ry:[18,22,14,20],ph:5.4,delay:210}];
  const bEls=BLOBS.map((_,i)=>document.getElementById("bl"+(i+1)));
  const globeSvg=document.querySelector(".globe-wrap svg");
  function getPulse(t){return(1-Math.cos((t/5000)*Math.PI*2))/2;}
  function pebblePath(cx,cy,t,b){const N=64,T=t*.0004+b.ph;const ki=(Math.sin(T)*.5+.5)*3;const k0=Math.floor(ki)%4,k1=(k0+1)%4,f=ki-Math.floor(ki);const brx=b.rx[k0]+(b.rx[k1]-b.rx[k0])*f,bry=b.ry[k0]+(b.ry[k1]-b.ry[k0])*f;const pts=[];for(let i=0;i<N;i++){const a=(i/N)*Math.PI*2;const r=1+.07*Math.sin(2*a+T*.6+b.ph)+.04*Math.sin(3*a-T*.4+b.ph*1.2)+.02*Math.cos(4*a+T*.25);pts.push([cx+brx*r*Math.cos(a),cy+bry*r*Math.sin(a)]);}let d=`M${pts[0][0].toFixed(2)},${pts[0][1].toFixed(2)}`;for(let i=0;i<N;i++){const p0=pts[(i-1+N)%N],p1=pts[i],p2=pts[(i+1)%N],p3=pts[(i+2)%N];const cp1x=p1[0]+(p2[0]-p0[0])/6,cp1y=p1[1]+(p2[1]-p0[1])/6,cp2x=p2[0]-(p3[0]-p1[0])/6,cp2y=p2[1]-(p3[1]-p1[1])/6;d+=`C${cp1x.toFixed(2)},${cp1y.toFixed(2)} ${cp2x.toFixed(2)},${cp2y.toFixed(2)} ${p2[0].toFixed(2)},${p2[1].toFixed(2)}`;}return d+"Z";}
  function tick(){angle+=speed;const t=performance.now();const baseS=((s)=>s*s*(3-2*s))(getPulse(t));if(globeSvg)globeSvg.style.transform=`scale(${1+baseS*.06})`;lons.forEach((el,i)=>{if(!el)return;const a=angle+offsets[i];el.setAttribute("rx",Math.abs(Math.cos(a)*R).toFixed(2));el.setAttribute("stroke-opacity",Math.cos(a)>=0?".8":".25");});BLOBS.forEach((b,i)=>{if(!bEls[i])return;const s=((r)=>r*r*(3-2*r))(getPulse(t-b.delay));const cx=b.gx+(b.hx-b.gx)*s,cy=b.gy+(b.hy-b.gy)*s;bEls[i].setAttribute("d",pebblePath(cx,cy,t,b));});rafId=requestAnimationFrame(tick);}
  const obs=new MutationObserver(()=>{const h=document.getElementById("landing").classList.contains("hidden");if(h&&rafId){cancelAnimationFrame(rafId);rafId=null;}else if(!h&&!rafId)tick();});
  obs.observe(document.getElementById("landing"),{attributes:true,attributeFilter:["class"]});
  tick();
})();

// ── BOOT (랜딩 없이 바로 지도 화면, 게스트 편집 모드) ──
(function boot(){
  isAuth=true;isDemo=false;currentUser=null;
  trips=loadLocal();
  document.getElementById("landing").classList.add("hidden");
  document.getElementById("app").classList.add("active");
  document.getElementById("tb-avatar").innerHTML=ICON_USER;
  document.getElementById("pv-avatar").innerHTML=ICON_USER;
  document.getElementById("pv-name").textContent="게스트";
  document.getElementById("pv-mode-badge").style.display="none";
  document.getElementById("pv-login-btn").style.display="none";
  document.getElementById("pv-logout-btn").style.display="none";
  renderAll();switchView("main");setTimeout(initMap,120);
})();
