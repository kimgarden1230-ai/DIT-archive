<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DIT 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  /* ── DIT Design System ── */
  /* Primary: mint — 인터랙션 전용 (CTA, active state, links) */
  --primary:#00C896;
  --primary-focus:#00B085;
  /* Accent: coral — 감정태그/뱃지 전용, 버튼 배경 금지 */
  --accent:#FF6B5E;
  /* Ink */
  --ink:#1D1D1F;
  --ink-muted:#6B6B70;
  /* Canvas */
  --canvas:#FFFFFF;
  --canvas-soft:#F7F7F8;
  --surface-dark:#1A1A1C;
  /* Hairline */
  --hairline:#E5E5E7;
  /* Error */
  --error:#FF3B30;
  /* ── Semantic aliases (코드 호환) ── */
  --sub:#6B6B70;
  --muted:#6B6B70;
  --border:#E5E5E7;
  --bg:#F7F7F8;
  --surface:#FFFFFF;
  --mint:#00C896;
  --mint-base:#00C896;
  --mint-hover:#00B085;
  --mint-light:rgba(0,200,150,.12);
  --mint-bg:rgba(0,200,150,.08);
  --coral-base:#FF6B5E;
  --coral-light:rgba(255,107,94,.1);
  --fog:#F7F7F8;
  --charcoal:#6B6B70;
  --gray:#6B6B70;
  --white:#FFFFFF;
  --text:#1D1D1F;
  --text2:#6B6B70;
  --primary-hover:#00B085;
  --lime:#00C896;
  --accent-bg:rgba(0,200,150,.08);
  --accent-light:rgba(0,200,150,.12);
  /* ── Radius — 4단계 고정 ── */
  --r-sm:8px;--r-md:12px;--r-lg:20px;--r-xl:20px;--r-pill:9999px;
  /* ── Shadow — 사진에만 허용, 카드/버튼 금지 ── */
  --shadow-sm:none;
  --shadow-md:none;
  --shadow-lg:none;
  --shadow-photo:0 4px 16px rgba(0,0,0,.12);
  /* ── Font ── */
  --font:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-head:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'SF Mono',Menlo,monospace;
  /* ── Spacing ── */
  --sp-xs:4px;--sp-sm:8px;--sp-md:16px;--sp-lg:24px;--sp-xl:32px;
  /* ── Font Size — 6단계 고정 ── */
  --fs-xs:0.65rem;   /* 10.4px — 레이블, 뱃지, 태그 */
  --fs-sm:0.75rem;   /* 12px   — 메타, 날짜, 캡션 */
  --fs-md:0.85rem;   /* 13.6px — 본문, 입력, 버튼 */
  --fs-lg:1rem;      /* 16px   — 카드 타이틀, 중요 본문 */
  --fs-xl:1.3rem;    /* 20.8px — 섹션 헤드라인 */
  --fs-2xl:1.9rem;   /* 30.4px — hero 숫자 */
}
html,body{height:100%;background:var(--canvas-soft);font-family:var(--font);color:var(--text);font-size:16px;-webkit-font-smoothing:antialiased;overflow:hidden}
@media(min-width:481px){
  #app{max-width:480px;margin:0 auto;box-shadow:0 0 48px rgba(0,0,0,.18)}
}
button{font-family:var(--font);cursor:pointer;-webkit-tap-highlight-color:transparent}
a,button,input,select,textarea,[onclick]{-webkit-tap-highlight-color:transparent}
input,textarea,select{font-family:var(--font);font-size:16px}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:var(--r-pill)}

.btn-primary-land{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.82rem 2rem;background:var(--mint);border:none;border-radius:var(--r-pill);font-size:var(--fs-md);font-weight:700;color:#fff;width:220px;transition:all .2s;letter-spacing:-.01em}
.btn-primary-land:hover{opacity:.88;transform:translateY(-2px)}
.btn-ghost-land{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.78rem 2rem;background:transparent;border:1.5px solid var(--border);border-radius:var(--r-pill);font-size:var(--fs-md);font-weight:600;color:var(--sub);width:220px;transition:all .2s}
.btn-ghost-land:hover{border-color:var(--mint);color:var(--mint)}

/* ── APP SHELL ── */
#app{display:flex;height:100vh;flex-direction:column;overflow:hidden;position:relative}

/* ── TOPBAR ── */
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.1rem;gap:.75rem;flex-shrink:0;z-index:200}
.tb-logo{flex-shrink:0;cursor:pointer;line-height:1}
.tb-logo .l1{font-family:var(--font-head);font-size:var(--fs-lg);font-weight:800;color:var(--ink);letter-spacing:-.02em;display:flex;align-items:center;gap:.4rem}
.tb-logo .dot{width:7px;height:7px;border-radius:50%;background:var(--mint);display:inline-block;flex-shrink:0}
.tb-logo .l2{font-size:var(--fs-xs);color:var(--muted);font-weight:400;letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.tb-avatar{width:34px;height:34px;border-radius:50%;background:#1D1D1F;display:flex;align-items:center;justify-content:center;color:#fff;font-size:var(--fs-sm);font-weight:700;flex-shrink:0;overflow:hidden;cursor:pointer}
.tb-avatar img{width:100%;height:100%;object-fit:cover}

/* ── BOTTOM NAV ── */
.bottom-nav{display:flex;align-items:center;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);z-index:250}
.bn-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.28rem;background:none;border:none;padding:.6rem .2rem .52rem;color:var(--muted);font-size:var(--fs-xs);font-weight:400;flex:1;letter-spacing:-.01em}
.bn-item .bni{width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted)}
.bn-item .bni svg{display:block;width:100%;height:100%;fill:currentColor}
.bn-item.active{color:var(--ink);font-weight:600}
.bn-item.active .bni{color:var(--primary)}
.bn-add{position:relative}
.bn-add .bni{width:50px;height:50px;border-radius:50%;background:var(--mint);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-22px}
.bn-add .bni svg{width:24px;height:24px}

/* ── MAIN VIEW ── */
#main-view{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;background:var(--bg)}
.map-panel{flex:0 0 42%;min-height:0;position:relative;overflow:hidden;margin:.8rem 1rem .6rem;border-radius:var(--r-xl);border:1px solid var(--hairline)}
#leaflet-map{width:100%;height:100%}
.leaflet-top,.leaflet-bottom{z-index:400}
.leaflet-control-zoom{border:none!important;border-radius:var(--r-sm)!important;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.14)!important}
.leaflet-control-zoom-in,.leaflet-control-zoom-out{border-radius:0!important;border:none!important;border-bottom:1px solid var(--hairline)!important;font-size:1rem!important;font-weight:400!important;color:var(--ink)!important;width:30px!important;height:30px!important;line-height:30px!important}
.leaflet-control-zoom-out{border-bottom:none!important}
.leaflet-control-attribution{display:none!important}


/* ── CARDS PANEL ── */
.cards-panel{flex:1;overflow-y:auto;background:var(--bg);min-height:0;overscroll-behavior:contain}
.cards-header{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem .5rem;position:sticky;top:0;background:var(--bg);z-index:10;gap:.5rem;flex-wrap:wrap}
.ch-title{font-size:var(--fs-md);font-weight:600;color:var(--sub);white-space:nowrap}
.ch-filter{display:flex;gap:.28rem;flex-wrap:wrap}
.cf-btn{font-size:var(--fs-xs);font-weight:600;padding:.28rem .7rem;border-radius:var(--r-pill);border:1px solid var(--hairline);background:var(--canvas-soft);color:var(--ink-muted);cursor:pointer;transition:all .15s}
.cf-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.country-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.75rem;padding:.3rem 1rem 5rem;align-items:stretch}
/* rec card */
.rec-card{background:var(--canvas);border-radius:var(--r-lg);border:1px solid var(--hairline);overflow:hidden;cursor:pointer;transition:border-color .18s,transform .18s}
.rec-card:hover{border-color:#C9C9CB;transform:translateY(-2px)}
.rc-thumb{width:100%;height:96px;object-fit:cover;display:block}
.rc-thumb-placeholder{width:100%;height:96px;display:flex;align-items:center;justify-content:center;font-size:2rem}
.rc-thumb-wrap{position:relative;overflow:hidden}.rc-thumb-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.15) 100%);pointer-events:none}
.rc-body{padding:.9rem 1rem .9rem}
.rc-top{display:flex;align-items:center;gap:.4rem;margin-bottom:.45rem}
.rc-flag{font-size:1rem;line-height:1;flex-shrink:0}
.rc-info{flex:1;min-width:0}
.rc-trip{font-family:var(--font-head);font-size:var(--fs-lg);font-weight:800;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.rc-country{font-size:var(--fs-sm);font-weight:400;margin-top:.12rem}
.rc-date{font-size:var(--fs-sm);color:var(--muted);margin-bottom:.35rem}
.rc-cities{font-size:var(--fs-sm);color:var(--sub);margin-bottom:.35rem}
.rc-preview{font-size:var(--fs-sm);color:var(--sub);line-height:1.65;margin-bottom:.35rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc-moods{display:flex;flex-wrap:wrap;gap:.25rem}
.rc-mood{font-size:var(--fs-xs);padding:3px 8px;border-radius:var(--r-pill);background:rgba(255,107,94,.1);color:var(--accent);font-weight:600}
.empty-cards{text-align:center;padding:2.5rem 1rem;color:var(--gray);grid-column:1/-1}
.empty-cards .ei{width:32px;height:32px;margin:0 auto .6rem;color:var(--muted);display:flex;align-items:center;justify-content:center}
.empty-cards .ei svg{width:100%;height:100%;fill:currentColor}
.empty-state-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.55rem;padding:1rem}
.es-title{font-family:var(--font-head);font-size:var(--fs-lg);font-weight:700;color:var(--ink);letter-spacing:-.02em}
.es-sub{font-size:var(--fs-sm);color:var(--gray);line-height:1.6}
.es-cta{margin-top:.4rem;background:var(--ink);color:var(--lime);border:none;padding:.55rem 1.4rem;border-radius:var(--r-pill);font-size:var(--fs-md);font-weight:700;cursor:pointer;transition:opacity .15s}
.es-cta:hover{opacity:.82}

/* ── TIMELINE ── */
#timeline-view{flex:1;overflow-y:auto;padding:1rem;display:none;min-height:0;background:var(--bg);overscroll-behavior:contain}
.tl-section-label{font-size:var(--fs-xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem;margin-top:.4rem;display:flex;align-items:center;gap:.5rem}
.tl-section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.year-section{margin-bottom:1.8rem}
.year-sidebar-label{font-size:var(--fs-xl);font-weight:600;color:var(--ink);letter-spacing:-.02em;line-height:1;padding:0.5rem 0 0.75rem}
.tl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem}
.tl-card{background:var(--canvas);border-radius:var(--r-lg);border:1px solid var(--hairline);overflow:hidden;cursor:pointer;transition:border-color .18s,transform .18s;display:flex;flex-direction:column}
.tl-card:hover{border-color:#C9C9CB;transform:translateY(-2px)}
.tl-cover{width:100%;height:120px;object-fit:cover;display:block;flex-shrink:0;object-position:center}
.tl-cover-placeholder{width:100%;height:120px;display:flex;align-items:center;justify-content:center;font-size:2rem;flex-shrink:0;background:var(--canvas-soft)}
.tl-body{padding:.9rem 1rem .9rem;flex:1;display:flex;flex-direction:column}
.tl-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.28rem}
.tl-emoji{font-size:var(--fs-xl);line-height:1;flex-shrink:0}
.tl-title{font-family:var(--font-head);font-size:var(--fs-lg);font-weight:800;line-height:1.3;flex:1;color:var(--ink)}
.tl-meta{font-size:var(--fs-sm);color:var(--muted);margin-bottom:.38rem}
.tl-ctags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:.38rem}
.tl-ctag{font-size:var(--fs-xs);font-weight:600;padding:3px 8px;border-radius:var(--r-pill);background:var(--bg);color:var(--sub)}
.tl-moods{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:.32rem}
.tl-mood{font-size:var(--fs-xs);padding:3px 8px;border-radius:var(--r-pill);background:rgba(255,107,94,.1);color:var(--accent);font-weight:600}
.tl-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:.4rem}
.tl-score{font-size:var(--fs-sm);font-weight:600;color:var(--mint)}
.tl-photo-count{font-size:var(--fs-sm);color:var(--muted)}

/* ── STATS ── */
#stats-view{flex:1;overflow-y:auto;padding:1rem;display:none;min-height:0;background:var(--bg)}

/* ── PROFILE ── */
#profile-view{flex:1;overflow-y:auto;padding:1.8rem 1rem 2rem;display:none;min-height:0;background:var(--bg)}
.pv-head{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:1.5rem}
.pv-avatar{width:68px;height:68px;border-radius:50%;background:#1D1D1F;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.5rem;font-weight:700;overflow:hidden;margin-bottom:.7rem}
.pv-avatar img{width:100%;height:100%;object-fit:cover}
.pv-name{font-family:var(--font-head);font-size:var(--fs-xl);font-weight:800;color:var(--ink);letter-spacing:-.02em}
.pv-btn{width:100%;margin-bottom:.6rem}
.stats-hero{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:.75rem}
.sh-card{border-radius:var(--r-lg);padding:14px 16px;position:relative;overflow:hidden;height:88px;display:flex;flex-direction:column;justify-content:center;background:var(--canvas);border:1px solid var(--hairline)}
.sh-val{font-family:var(--font);font-size:var(--fs-2xl);font-weight:600;color:var(--ink);line-height:1;letter-spacing:-.03em}
.sh-label{font-size:var(--fs-xs);font-weight:400;color:var(--muted);margin-top:.25rem}
.sh-icon{position:absolute;bottom:.6rem;right:.8rem;width:28px;height:28px;opacity:.1;color:var(--ink)}
.sh-icon svg{width:100%;height:100%;fill:currentColor}
.chart-card{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:.65rem;overflow:hidden}
.chart-title{font-size:var(--fs-md);font-weight:600;color:var(--sub);margin-bottom:.85rem}
.chart-count{font-size:var(--fs-md);font-weight:400;color:var(--gray);margin-left:.35rem}
/* bar */
.u-bar-row{display:flex;align-items:center;gap:.55rem;margin-bottom:.48rem}
.u-bar-row:last-child{margin-bottom:0}
.u-bar-left{font-size:var(--fs-sm);font-weight:400;color:var(--charcoal);flex-shrink:0;line-height:1.2}
.u-bar-track{flex:1;height:8px;background:var(--fog);border-radius:var(--r-pill);overflow:hidden}
.u-bar-fill{height:8px;border-radius:var(--r-pill);transition:width .5s cubic-bezier(.34,1.2,.64,1)}
.u-bar-right{font-size:var(--fs-sm);font-weight:600;color:var(--ink);width:16px;text-align:right;flex-shrink:0}
/* donut */
.donut-wrap{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.donut-legend{display:flex;flex-direction:column;gap:.5rem;flex:1;min-width:0}
.dl-item{display:flex;align-items:center;gap:.45rem}
.dl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dl-name{font-size:var(--fs-sm);font-weight:400;color:var(--charcoal);width:52px;flex-shrink:0}
.s-bar-track{flex:1;height:8px;background:var(--fog);border-radius:var(--r-pill);overflow:hidden}
.s-bar-fill{height:8px;border-radius:var(--r-pill);transition:width .5s cubic-bezier(.34,1.2,.64,1)}
.s-bar-val{font-size:var(--fs-sm);font-weight:600;color:var(--ink);width:16px;text-align:right;flex-shrink:0}
/* top countries */
.top-country-row{display:flex;align-items:center;gap:.65rem;padding:.5rem 0;border-bottom:1px solid var(--border)}
.top-country-row:last-child{border-bottom:none;padding-bottom:0}
.tcr-rank{font-size:var(--fs-xs);font-weight:600;color:var(--gray);width:14px;text-align:center;flex-shrink:0}
.tcr-badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);font-weight:700;color:#fff;flex-shrink:0}
.tcr-info{flex:1;min-width:0}
.tcr-name{font-size:var(--fs-sm);font-weight:600;color:var(--ink)}
.tcr-sub{font-size:var(--fs-xs);font-weight:400;color:var(--gray);margin-top:.04rem}
.tcr-score{font-size:var(--fs-sm);font-weight:600;color:var(--charcoal);flex-shrink:0}
.photo-mosaic{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-radius:var(--r-md);overflow:hidden}
.photo-mosaic img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;border-radius:var(--r-sm);transition:opacity .15s}
.photo-mosaic img:hover{opacity:.85}
.pm-more{aspect-ratio:1;background:var(--canvas-soft);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:var(--fs-sm);font-weight:700;color:var(--ink-muted);cursor:pointer;border:1px solid var(--hairline)}
.pm-more:hover{background:var(--hairline)}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;z-index:500;background:rgba(28,28,30,.45);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-bg.open{opacity:1;pointer-events:all}
@media(min-width:600px){.modal-bg{align-items:center;padding:1.5rem}}
.modal{background:#fff;border-radius:var(--r-xl) var(--r-xl) 0 0;width:100%;max-width:620px;height:auto;max-height:88dvh;display:flex;flex-direction:column;overflow:hidden;transform:translateY(24px);transition:transform .3s cubic-bezier(.34,1.4,.64,1);overscroll-behavior:contain}
@media(min-width:600px){.modal{border-radius:var(--r-xl);transform:translateY(12px) scale(.97)}}
.modal-bg.open .modal{transform:translateY(0) scale(1)}
#modal-mini-map{height:clamp(160px,38dvh,280px);width:100%;overflow:hidden;background:var(--canvas-soft);border-radius:var(--r-lg) var(--r-lg) 0 0;flex-shrink:0}
#modal-mini-map .leaflet-container{height:100%!important;width:100%!important;background:var(--canvas-soft)}
.modal-content{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto}
.modal-content:has(.tl-swiper-wrap){overflow:hidden}
.modal-head{padding:.9rem 1.2rem .7rem;display:flex;align-items:flex-start;gap:.65rem;position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);z-index:2}
.mh-emoji{font-size:1.6rem;line-height:1}
.mh-info{flex:1;min-width:0}
.mh-title{font-family:var(--font-head);font-size:var(--fs-xl);font-weight:800;margin-bottom:.1rem;line-height:1.3;color:var(--ink);letter-spacing:-.02em}
.mh-meta{font-size:var(--fs-xs);color:var(--gray);display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.mh-status{font-size:var(--fs-xs);font-weight:600;padding:2px 8px;border-radius:var(--r-pill)}
.mh-actions{display:flex;align-items:center;gap:.6rem;flex-shrink:0}
.mh-share-btn{background:var(--fog);border:1px solid var(--border);border-radius:var(--r-md);padding:.3rem .65rem;font-size:var(--fs-xs);font-weight:600;color:var(--charcoal);transition:all .15s}
.mh-share-btn:hover{border-color:var(--mint-base);color:var(--mint-base)}
.mh-close{background:none;border:none;color:var(--gray);padding:.15rem;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.mh-close svg{width:100%;height:100%;fill:currentColor}
.modal-tabs{display:flex;border-bottom:1px solid var(--border);background:#fff;padding:0 1.2rem;position:sticky;top:60px;z-index:1;overflow-x:auto}
.mt-btn{font-size:var(--fs-sm);font-weight:600;padding:.58rem .8rem;background:none;border:none;color:var(--gray);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;letter-spacing:-.01em}
.mt-btn.active{color:var(--mint);border-bottom-color:var(--mint)}
.modal-body{padding:16px 20px 24px}
.country-tabs{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.9rem}
.ct-btn{font-size:var(--fs-sm);font-weight:600;padding:.32rem .85rem;border-radius:var(--r-pill);border:1.5px solid var(--border);background:#fff;color:var(--charcoal);cursor:pointer;transition:all .15s}
.ct-btn.active{background:var(--mint-base);color:#fff;border-color:var(--mint-base)}
.mood-chips{display:flex;flex-wrap:wrap;gap:.25rem;margin-bottom:.75rem}
.mc{font-size:var(--fs-xs);padding:3px 8px;border-radius:var(--r-pill);background:rgba(255,107,94,.1);color:var(--accent);font-weight:600}
.score-display{font-size:var(--fs-xl);font-weight:700;color:var(--mint-hover);margin-bottom:.5rem;letter-spacing:-.02em}
.modal-actions{display:flex;gap:.5rem;padding:0 1.2rem 1.3rem;flex-wrap:wrap}
.ma-btn{flex:1;padding:.7rem 2rem;border-radius:var(--r-pill);border:none;font-size:var(--fs-sm);font-weight:600;cursor:pointer;transition:all .18s;min-height:44px}
.ma-edit{background:var(--bg);color:var(--sub);border:1px solid var(--border)}
.ma-edit:hover{border-color:var(--mint);color:var(--mint)}
.ma-reality{background:var(--mint);color:#fff}
.ma-reality:hover{opacity:.88}
/* AI tab */
.ai-tab-wrap{padding:16px 20px 24px}
.ai-modes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1rem}
.ai-mode-btn{padding:.6rem .4rem;background:var(--fog);border:1.5px solid var(--border);border-radius:var(--r-lg);font-size:var(--fs-xs);font-weight:600;color:var(--charcoal);transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:.25rem;cursor:pointer}
.ai-mode-btn .ami{width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.ai-mode-btn .ami svg{width:100%;height:100%;fill:currentColor}
.ai-mode-btn:hover{border-color:var(--mint-base);color:var(--mint-hover)}
.ai-mode-btn.done{border-color:rgba(0,200,150,.4);background:rgba(0,200,150,.06);color:var(--mint-hover)}
.ai-mode-btn:disabled{opacity:.45;cursor:not-allowed}
.ai-result-card{background:var(--fog);border:1px solid var(--border);border-left:3px solid var(--mint-base);border-radius:var(--r-lg);padding:.8rem .95rem;margin-bottom:.65rem}
.ai-rc-label{font-size:var(--fs-xs);font-weight:600;letter-spacing:.08em;color:var(--mint-hover);text-transform:uppercase;margin-bottom:.3rem}
.ai-rc-text{font-size:var(--fs-md);color:var(--charcoal);line-height:1.75}
.ai-locked{text-align:center;padding:2rem 0;color:var(--gray)}
.ai-locked .ali{width:32px;height:32px;margin:0 auto .5rem;color:var(--muted);display:flex;align-items:center;justify-content:center}
.ai-locked .ali svg{width:100%;height:100%;fill:currentColor}
.ai-locked p{font-size:var(--fs-md);line-height:1.7;color:var(--charcoal)}
.spinner{width:11px;height:11px;border:2px solid rgba(0,0,0,.08);border-top-color:var(--mint-base);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
/* photos */
/* ── Photo story tab ── */
.ph-scene{background:#000;display:flex;flex-direction:column;overflow:hidden}
.ph-bars{display:flex;gap:3px;padding:10px 12px 6px;flex-shrink:0}
.ph-bar{flex:1;height:5px;border-radius:var(--r-pill);background:rgba(255,255,255,.25)}
.ph-bar.ph-done{background:rgba(255,255,255,.9)}
.ph-bar.ph-on{background:rgba(255,255,255,.9)}
.ph-label{color:rgba(255,255,255,.65);font-size:var(--fs-xs);font-weight:400;padding:0 12px 6px;flex-shrink:0}
.ph-main{position:relative;cursor:pointer;flex-shrink:0;height:300px;background:#111}
.ph-main img{width:100%;height:100%;object-fit:cover;display:block}
.ph-tap-l,.ph-tap-r{position:absolute;top:0;bottom:0;width:50%;z-index:2}
.ph-tap-l{left:0}.ph-tap-r{right:0}
.ph-thumb-wrap{position:relative;flex-shrink:0}
.ph-star-btn{position:absolute;top:10px;right:12px;padding:0;background:none;border:none;color:rgba(255,255,255,.4);font-size:var(--fs-xl);line-height:1;cursor:pointer;transition:color .15s;z-index:3;-webkit-text-stroke:.6px rgba(0,0,0,.35);paint-order:stroke fill}
.ph-star-btn.on{color:#FFD700;-webkit-text-stroke:.6px rgba(0,0,0,.25)}
.ph-thumb-cover{position:absolute;top:4px;right:4px;font-size:9px;line-height:1;color:#FFD700;-webkit-text-stroke:.4px rgba(0,0,0,.4);paint-order:stroke fill;pointer-events:none}
.ph-thumbs{display:flex;gap:4px;padding:10px 12px 12px;overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch;scrollbar-width:none;justify-content:center}
.ph-thumbs::-webkit-scrollbar{display:none}
.ph-thumb{width:54px;height:54px;object-fit:cover;border-radius:var(--r-sm);opacity:.45;cursor:pointer;flex-shrink:0;transition:opacity .15s,outline .15s}
.ph-thumb.ph-on{opacity:1;outline:2px solid var(--primary);outline-offset:2px}
.ph-add-btn{width:54px;height:54px;border-radius:var(--r-sm);border:1.5px dashed rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s}
.ph-add-btn:hover{background:rgba(255,255,255,.2)}
.ph-add-btn svg{width:20px;height:20px;fill:currentColor}
.pg-add-btn{width:26px;height:26px;border-radius:50%;background:var(--canvas-soft);border:1.5px solid var(--hairline);color:var(--ink-muted);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:0;flex-shrink:0;transition:background .12s;padding:0}
.pg-add-btn:active{background:var(--hairline)}
.photo-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.45rem}
.photo-upload-area{border:1.5px dashed var(--border);border-radius:var(--r-lg);padding:.9rem;text-align:center;cursor:pointer;transition:all .18s;background:#fafafa}
.photo-upload-area:hover{border-color:var(--mint-base);background:rgba(0,200,150,.03)}
.photo-upload-area input{display:none}
.pua-icon{width:22px;height:22px;margin:0 auto .25rem;color:var(--muted);display:flex;align-items:center;justify-content:center}
.pua-icon svg{width:100%;height:100%;fill:currentColor}
.pua-text{font-size:var(--fs-sm);color:var(--gray)}
.pua-text strong{color:var(--mint-hover)}
/* share */
.share-panel{padding:1.1rem 1.2rem 1.4rem}
.share-title{font-size:var(--fs-md);font-weight:700;color:var(--ink);margin-bottom:.9rem;letter-spacing:-.02em}
.share-btns{display:flex;flex-direction:column;gap:.55rem}
.share-btn{display:flex;align-items:center;gap:.7rem;padding:.75rem .95rem;background:var(--fog);border:1px solid var(--border);border-radius:var(--r-lg);font-size:var(--fs-md);font-weight:600;color:var(--ink);transition:all .18s}
.share-btn:hover{border-color:var(--mint-base);background:rgba(0,200,150,.04)}
.share-btn-icon{font-size:var(--fs-xl);width:26px;text-align:center;flex-shrink:0}
.share-btn-desc{font-size:var(--fs-xs);font-weight:400;color:var(--gray);display:block;margin-top:.08rem}

/* ── FORM ── */
#form-view{flex:1;overflow-y:auto;display:none;flex-direction:column;min-height:0}
.form-topbar{height:52px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.1rem;gap:.65rem;flex-shrink:0;position:sticky;top:0;z-index:100}
.ftb-back{background:none;border:none;font-size:var(--fs-sm);font-weight:400;color:var(--charcoal);display:flex;align-items:center;gap:.25rem;letter-spacing:-.01em}
.ftb-close{background:none;border:none;color:var(--ink-muted);display:flex;align-items:center;justify-content:center;padding:4px;cursor:pointer}
.ftb-back:hover{color:var(--ink)}
.ftb-title{font-size:var(--fs-md);font-weight:600;flex:1;color:var(--ink);letter-spacing:-.02em}
.ftb-save{background:var(--mint);color:#fff;border:none;padding:.45rem 1.2rem;border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:700;transition:opacity .15s}
.ftb-save:hover{opacity:.85}
.form-body{max-width:640px;margin:0 auto;padding:1rem;width:100%;padding-bottom:3rem}
.emoji-grid{display:flex;flex-wrap:wrap;gap:.32rem;margin-bottom:.7rem}
.eg-btn{font-size:var(--fs-lg);padding:.26rem .32rem;border-radius:var(--r-sm);border:1.5px solid var(--border);background:#fff;cursor:pointer;transition:all .12s}
.eg-btn.on{border-color:var(--mint-base);background:rgba(0,200,150,.08)}
/* country search */
.cs-wrap{position:relative;margin-bottom:.65rem}
.cs-inp{width:100%;padding:.52rem .72rem;border:1.5px solid var(--border);border-radius:var(--r-md);font-size:var(--fs-md);outline:none;color:var(--ink);background:#fff;transition:border-color .15s}
.cs-inp:focus{border-color:var(--mint-base)}
.cs-dd{position:absolute;top:calc(100%+3px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);z-index:300;max-height:200px;overflow-y:auto;display:none}
.cs-item{padding:.48rem .78rem;cursor:pointer;display:flex;align-items:center;gap:.52rem;font-size:var(--fs-md);border-bottom:1px solid var(--fog);transition:background .1s}
.cs-item:hover{background:var(--fog)}
.sel-countries{display:flex;flex-wrap:wrap;gap:.32rem;margin-bottom:.65rem}
.sel-c{display:inline-flex;align-items:center;gap:.32rem;padding:.25rem .62rem;border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:600;background:rgba(0,200,150,.1);color:var(--mint-hover)}
.sel-c-rm{opacity:.5;cursor:pointer;display:inline-flex;align-items:center;width:12px;height:12px}
.sel-c-rm svg{width:100%;height:100%;fill:currentColor}
/* photo upload */
.photo-preview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:.7rem}
.photo-preview-item{position:relative;border-radius:var(--r-md);overflow:hidden}
.photo-preview-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.photo-del-btn{position:absolute;top:3px;right:3px;width:18px;height:18px;background:rgba(0,0,0,.55);border:none;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:3px}
.photo-del-btn svg{width:100%;height:100%;fill:currentColor}
/* mood */
.mood-sel{display:flex;flex-wrap:wrap;gap:.32rem}
.ms-btn{font-size:var(--fs-sm);padding:.26rem .68rem;border-radius:var(--r-pill);border:1.5px solid var(--border);background:#fff;color:var(--charcoal);cursor:pointer;transition:all .12s}
.ms-btn.on{border-color:var(--mint-base);background:rgba(0,200,150,.08);color:var(--mint-hover)}
.score-wrap{display:flex;align-items:center;gap:.65rem}
input[type=range]{flex:1;accent-color:var(--mint-base)}
.del-btn{width:100%;padding:.5rem;background:rgba(0,0,0,.04);border:1px solid var(--border);border-radius:var(--r-md);color:var(--muted);font-size:var(--fs-sm);font-weight:600;cursor:pointer;transition:all .15s}
.del-btn:hover{background:rgba(0,0,0,.08);color:var(--ink)}

/* share card */
#share-card{position:fixed;left:-9999px;top:0;width:480px;background:#fff;font-family:var(--font);border-radius:var(--r-xl);overflow:hidden;z-index:-1}
.sc-header{padding:1.3rem 1.5rem .9rem;background:var(--mint-base)}
.sc-emoji{font-size:2rem;margin-bottom:.35rem;display:block}
.sc-title{font-size:var(--fs-xl);font-weight:700;color:#fff;margin-bottom:.18rem;letter-spacing:-.03em}
.sc-dates{font-size:var(--fs-sm);color:rgba(255,255,255,.7)}
.sc-body{padding:.9rem 1.5rem 1.2rem}
.sc-countries-row{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.8rem}
.sc-ctag{font-size:var(--fs-xs);font-weight:600;padding:3px 8px;border-radius:var(--r-pill);background:var(--canvas-soft);color:var(--ink-muted)}
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:.8rem}
.sc-item{background:var(--fog);border-radius:var(--r-md);padding:.55rem .65rem}
.sc-item-label{font-size:var(--fs-xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);margin-bottom:.18rem}
.sc-item-val{font-size:var(--fs-md);font-weight:700;color:var(--ink)}
.sc-score-row{display:flex;align-items:center;gap:.55rem}
.sc-score-label{font-size:var(--fs-xs);font-weight:600;color:var(--gray)}
.sc-score-bar{flex:1;height:5px;background:var(--border);border-radius:var(--r-pill);overflow:hidden}
.sc-score-fill{height:100%;border-radius:var(--r-pill);background:var(--mint-base)}
.sc-score-val{font-size:var(--fs-sm);font-weight:700;color:var(--mint-hover)}
.sc-footer{padding:.65rem 1.5rem;background:var(--fog);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sc-footer-logo{font-size:var(--fs-xs);font-weight:700;color:var(--mint-hover)}
.sc-footer-sub{font-size:var(--fs-xs);color:var(--gray)}

/* stats gallery overlay */
#stats-gallery{position:absolute;inset:0;z-index:910;background:#000;display:none;flex-direction:column}
#stats-gallery-scene{flex:1;min-height:0;display:flex;flex-direction:column}
#stats-gallery.open{display:flex}
#stats-gallery .ph-scene{flex:1;min-height:0;display:flex;flex-direction:column}
#stats-gallery .ph-main{flex:1;min-height:0;height:auto;display:flex;align-items:center;justify-content:center}
#stats-gallery .ph-main img{width:100%;height:100%;object-fit:contain}
#stats-gallery .sg-close{position:absolute;top:1rem;right:1rem;z-index:10;background:rgba(255,255,255,.12);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:8px}
#stats-gallery .sg-close svg{width:100%;height:100%;fill:currentColor}
/* lightbox */
#lightbox{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center}
#lightbox.open{display:flex}
#lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:var(--r-md)}
#lightbox-close{position:absolute;top:1rem;right:1rem;background:rgba(255,255,255,.12);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:8px}
#lightbox-close svg{width:100%;height:100%;fill:currentColor}

/* map */
.map-popup{font-family:var(--font);min-width:185px}
.mp-title{font-size:var(--fs-md);font-weight:700;margin-bottom:.12rem;color:var(--ink)}
.mp-date{font-size:var(--fs-xs);color:var(--gray);margin-bottom:.42rem}
.mp-ctags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:.5rem}
.mp-c{font-size:var(--fs-xs);padding:3px 8px;border-radius:var(--r-pill);font-weight:600;cursor:pointer;background:var(--canvas-soft);color:var(--ink-muted)}
.mp-open{width:100%;padding:.38rem;background:var(--mint-base);border:none;border-radius:var(--r-md);color:#fff;font-family:var(--font);font-size:var(--fs-sm);font-weight:600;cursor:pointer;margin-bottom:.28rem;transition:opacity .15s}
.mp-open:hover{opacity:.85}
.mp-reality{width:100%;padding:.36rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);color:var(--sub);font-family:var(--font);font-size:var(--fs-sm);font-weight:600;cursor:pointer;transition:all .15s}
.mp-reality:hover{border-color:var(--mint);color:var(--mint)}
.leaflet-popup-content-wrapper{border-radius:var(--r-lg)!important;border:1px solid var(--border);font-family:var(--font);box-shadow:var(--shadow-md)!important}
.leaflet-popup-content{margin:12px 13px!important}

/* toast */
.toast{position:fixed;bottom:4.5rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.5rem 1.1rem;border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:400;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow-md)}
.toast.show{opacity:1}

/* ── STATS ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes donutPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes barSlide{from{width:0!important}to{}}
.stats-anim .sh-card{opacity:0;animation:fadeUp .38s ease forwards}
.stats-anim .sh-card:nth-child(1){animation-delay:.04s}
.stats-anim .sh-card:nth-child(2){animation-delay:.1s}
.stats-anim .sh-card:nth-child(3){animation-delay:.16s}
.stats-anim .sh-card:nth-child(4){animation-delay:.22s}
.stats-anim .sh-card:nth-child(5){animation-delay:.28s}
.stats-anim .sh-card:nth-child(6){animation-delay:.34s}
.stats-anim .chart-card{opacity:0;animation:fadeUp .4s ease forwards}
.stats-anim .chart-card:nth-child(1){animation-delay:.3s}
.stats-anim .chart-card:nth-child(2){animation-delay:.38s}
.stats-anim .chart-card:nth-child(3){animation-delay:.46s}
.stats-anim .chart-card:nth-child(4){animation-delay:.52s}
.stats-anim .chart-card:nth-child(5){animation-delay:.58s}
.stats-anim .donut-wrap svg{transform-origin:center;animation:donutPop .5s cubic-bezier(.34,1.2,.64,1) .4s both}
.bar-anim{transition:width .65s cubic-bezier(.34,1.1,.64,1)!important}
/* Star Rating */
.star-row{display:flex;gap:.2rem;margin-bottom:1.25rem}
.star-btn{font-size:1.7rem;background:none;border:none;cursor:pointer;padding:0 .05rem;line-height:1;transition:transform .12s,color .12s;color:var(--hairline)}
.star-btn.hovered:not(.filled){color:#9E9EA3}
.star-btn.filled{color:var(--accent)}
.stars-disp{font-size:var(--fs-md);letter-spacing:.04rem;color:var(--accent)}
.stars-disp .empty{color:var(--hairline)}
/* Tag Cloud */
.tag-cloud{position:relative;overflow:visible}
.tag-cloud-item{position:absolute;line-height:1.2;cursor:pointer;white-space:nowrap;opacity:0;transform:translate(-50%,-50%) scale(0.6);transition:opacity .35s ease,transform .35s cubic-bezier(0.34,1.2,0.64,1),filter .2s ease}
.tag-cloud-item.tc-show{opacity:var(--tc-op,1);transform:translate(-50%,-50%) scale(1)}
.tag-cloud-item.tc-show:hover{transform:translate(-50%,-50%) scale(1.18);filter:brightness(1.08)}
.tag-cloud-item.tc-show:active{transform:translate(-50%,-50%) scale(0.92);transition:transform .08s cubic-bezier(0.4,1.0,0.6,1),opacity .35s ease,filter .2s ease}

/* ── WIZARD FORM ── */
.wiz-progress{display:flex;align-items:center;gap:.4rem;flex:1;justify-content:center}
.wiz-dot{height:6px;border-radius:9999px;background:var(--hairline);transition:all .25s}
.wiz-dot.done{background:var(--primary);opacity:.45;width:6px}
.wiz-dot.active{background:var(--primary);width:22px}
.wiz-dot.idle{width:6px}
.wiz-wrap{padding:1.5rem 1.1rem 1rem;max-width:480px;margin:0 auto;width:100%}
.wiz-sticky-footer{position:sticky;bottom:0;background:#F7F7F8;padding:.5rem 0 calc(.75rem + env(safe-area-inset-bottom));margin-top:.5rem}
.wiz-headline{font-size:var(--fs-xl);font-weight:700;color:var(--ink);margin-bottom:.2rem;letter-spacing:-.025em}
.wiz-sub{font-size:var(--fs-md);color:var(--ink-muted);margin-bottom:1.5rem;line-height:1.55}
.wiz-footer{padding:.25rem 0 0;display:flex;gap:.65rem;margin-top:.25rem}
.wiz-next{flex:1;background:var(--primary);color:#fff;border:none;padding:12px 16px;border-radius:var(--r-pill);font-size:var(--fs-md);font-weight:700;transition:opacity .15s;cursor:pointer}
.wiz-next:disabled{opacity:.35;cursor:default}
.wiz-prev{background:none;border:1.5px solid var(--hairline);padding:.72rem 1.1rem;border-radius:var(--r-pill);font-size:var(--fs-md);font-weight:600;color:var(--ink-muted);cursor:pointer}
.wiz-delete{width:100%;padding:12px 16px;background:transparent;border:1.5px solid var(--error);border-radius:var(--r-pill);color:var(--error);font-size:var(--fs-md);font-weight:600;cursor:pointer;font-family:var(--font)}
.mood-chip{font-size:var(--fs-md);padding:.42rem .85rem;border-radius:var(--r-pill);border:1.5px solid var(--hairline);background:var(--canvas);cursor:pointer;transition:all .15s;font-weight:600;white-space:nowrap}
.mood-chip.on{border-color:var(--accent);background:#fff3f2;color:var(--accent)}
.mood-chip.sm{font-size:var(--fs-xs);padding:.15rem .5rem;cursor:default;border:none;display:inline-flex;align-items:center;gap:.2rem}
.mood-grid{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.25rem}
.photo-zone{border:2px dashed var(--hairline);border-radius:var(--r-lg);padding:1.5rem;text-align:center;cursor:pointer;transition:border-color .15s;margin-bottom:.75rem}
.photo-zone:hover{border-color:var(--primary)}
.pz-icon{width:32px;height:32px;color:var(--ink-muted);margin:0 auto .5rem}
.pz-icon svg{width:100%;height:100%;fill:currentColor}
.pz-text{font-size:var(--fs-md);color:var(--ink-muted)}
.pz-text strong{color:var(--ink);font-weight:600}
.more-toggle{width:100%;padding:.62rem;border:1.5px solid var(--hairline);border-radius:var(--r-md);background:var(--canvas-soft);font-size:var(--fs-sm);font-weight:600;color:var(--ink-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.35rem;margin-bottom:1.25rem;transition:all .15s}
.more-toggle:hover{border-color:var(--primary);color:var(--primary)}
.more-toggle svg{width:14px;height:14px;fill:currentColor;transition:transform .2s}
.more-toggle.open svg{transform:rotate(180deg)}
.more-section{margin-bottom:.25rem}
.ctab-row{display:flex;gap:.4rem;overflow-x:auto;margin-bottom:1.25rem;scrollbar-width:none}
.ctab-row::-webkit-scrollbar{display:none}
.ctab-btn{padding:.38rem .9rem;border-radius:var(--r-pill);border:1.5px solid var(--hairline);font-size:var(--fs-sm);font-weight:600;white-space:nowrap;background:var(--canvas);color:var(--ink-muted);cursor:pointer;flex-shrink:0}
.ctab-btn.active{border-color:var(--primary);background:var(--mint-light);color:var(--primary)}
.wiz-label{font-size:var(--fs-xs);font-weight:600;letter-spacing:.04em;color:var(--gray);text-transform:uppercase;margin-bottom:.5rem;display:block}
.date-row{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:.5rem}
.date-row input{width:100%;padding:.52rem .72rem;border:1.5px solid var(--border);border-radius:var(--r-md);font-size:var(--fs-md);outline:none;color:var(--ink);background:#fff;transition:border-color .15s}
.date-row input:focus{border-color:var(--mint-base)}
.days-badge{font-family:var(--font);font-size:var(--fs-sm);color:var(--primary);font-weight:600;margin-bottom:1.25rem;text-align:right}
.wiz-inp{width:100%;padding:.56rem .78rem;border:1.5px solid var(--border);border-radius:var(--r-md);font-size:var(--fs-md);outline:none;color:var(--ink);background:#fff;transition:border-color .15s;margin-bottom:1.25rem}
.wiz-inp:focus{border-color:var(--mint-base)}
.wiz-textarea{width:100%;padding:.56rem .78rem;border:1.5px solid var(--border);border-radius:var(--r-md);font-size:var(--fs-md);outline:none;color:var(--ink);background:#fff;resize:vertical;min-height:88px;line-height:1.6;transition:border-color .15s;margin-bottom:1.25rem}
.wiz-textarea:focus{border-color:var(--mint-base)}
/* ── 타임라인 폼 (step 2) ── */
.tl-form-list{display:flex;flex-direction:column;gap:0;margin-bottom:1rem}
.tl-day-row{display:flex;gap:10px;padding:.4rem 0;cursor:pointer;position:relative}
.tl-day-row:not(:last-child)::before{content:'';position:absolute;left:13px;top:52px;bottom:0;width:1.5px;background:var(--hairline)}
.tl-day-left{width:28px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:2px}
.tl-day-num{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--hairline);background:var(--canvas);display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);font-weight:600;color:var(--ink-muted);flex-shrink:0}
.tl-day-num.filled{background:var(--mint-light);border-color:var(--primary);color:var(--primary)}
.tl-day-num.active{background:var(--primary);border-color:var(--primary);color:#fff}
.tl-day-date{font-size:9px;color:var(--ink-muted);white-space:nowrap}
.tl-day-card{flex:1;border:1px solid var(--hairline);border-radius:var(--r-md);padding:.6rem .75rem;background:var(--canvas);transition:border-color .15s;min-height:40px;margin-bottom:8px}
.tl-day-card.active{border-color:var(--primary);background:#fff}
.tl-day-card.empty{background:var(--canvas-soft)}
.tl-day-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.tl-day-loc{font-size:var(--fs-md);font-weight:600;color:var(--ink)}
.tl-day-loc.empty{color:var(--ink);font-weight:600;font-size:var(--fs-md)}
.tl-day-memo{font-size:var(--fs-sm);color:var(--ink-muted);margin-top:.3rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tl-day-photos{display:flex;gap:.3rem;margin-top:.4rem}
.tl-day-thumb-wrap{position:relative;display:inline-block;border-radius:var(--r-sm);overflow:hidden}.tl-day-thumb-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.15) 100%);pointer-events:none}
.tl-day-thumb{width:40px;height:40px;border-radius:var(--r-sm);object-fit:cover;display:block}
.tl-edit-panel{border-top:1px solid var(--hairline);margin-top:.6rem;padding-top:.6rem}
.day-textarea{width:100%;padding:8px 12px;border:1.5px solid var(--hairline);border-radius:var(--r-sm);font-size:var(--fs-md);outline:none;color:var(--ink);background:#fff;resize:vertical;min-height:68px;line-height:1.6;transition:border-color .15s;font-family:var(--font);box-sizing:border-box}
.day-textarea:focus{border-color:var(--primary)}
.loc-suggest{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.5rem}
.loc-chip{background:var(--canvas-soft);border:1px solid var(--hairline);border-radius:var(--r-pill);padding:.2rem .65rem;font-size:var(--fs-xs);color:var(--ink-muted);cursor:pointer}
.loc-chip.used{background:var(--mint-light);border-color:var(--primary);color:var(--primary)}
/* 모달 타임라인 */
.tl-modal-row{display:flex;gap:10px;padding:.5rem 0;border-bottom:1px solid var(--hairline)}
.tl-modal-row.dim .tl-modal-card{opacity:.45}
.tl-modal-left{width:36px;flex-shrink:0;text-align:center;padding-top:2px}
.tl-modal-num{font-size:var(--fs-sm);font-weight:700;color:var(--primary);white-space:nowrap;margin-bottom:.1rem}
.tl-modal-date{font-size:9px;color:var(--ink-muted);white-space:nowrap}
.tl-modal-card{flex:1}
.tl-modal-loc{font-size:var(--fs-md);font-weight:600;color:var(--ink);margin-bottom:.25rem}
.tl-modal-memo{font-size:var(--fs-sm);color:var(--ink-muted);line-height:1.6;white-space:pre-wrap}
.tl-modal-photos{display:flex;gap:.3rem;margin-top:.4rem;flex-wrap:wrap}
.tl-modal-thumb-wrap{position:relative;display:inline-block;border-radius:var(--r-sm);overflow:hidden;cursor:pointer}.tl-modal-thumb-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.15) 100%);pointer-events:none}
.tl-modal-thumb{width:52px;height:52px;border-radius:var(--r-sm);object-fit:cover;display:block}
/* 타임라인 카드 스와이퍼 */
.tl-swiper-wrap{display:flex;flex-direction:column;flex:1;min-height:0;overflow:visible}
.tl-day-slider{padding:1.2rem 1.1rem .6rem;flex-shrink:0;overflow:visible;cursor:pointer;user-select:none}
.tl-slider-track{position:relative;height:3px;background:var(--hairline);border-radius:var(--r-pill);overflow:visible;margin:0 1.2rem}
.tl-slider-fill{position:absolute;left:0;top:0;height:100%;background:var(--primary);border-radius:var(--r-pill);pointer-events:none;opacity:.4}
.tl-slider-pill{position:absolute;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;border-radius:var(--r-pill);padding:.22rem .65rem;font-size:var(--fs-xs);font-weight:700;white-space:nowrap;pointer-events:none}
.tl-carousel-viewport{flex:0 0 auto;overflow:hidden;cursor:grab;user-select:none;touch-action:pan-y}
.tl-carousel-viewport.dragging{cursor:grabbing}
.tl-carousel-track{display:flex;align-items:stretch;padding:.75rem 1.1rem 1rem;gap:.75rem;will-change:transform}
.tl-swipe-card{flex:0 0 82%;padding:1.1rem 1.1rem .9rem;box-sizing:border-box;display:flex;flex-direction:column;gap:.55rem;background:var(--canvas-soft);border-radius:var(--r-md);border:1px solid var(--hairline);overflow-y:auto}
.tl-card-header{display:flex;align-items:baseline;gap:.5rem}
.tl-card-day{font-size:var(--fs-sm);font-weight:700;color:var(--primary)}
.tl-card-date{font-size:var(--fs-xs);color:var(--ink-muted)}
.tl-card-loc{font-size:var(--fs-lg);font-weight:700;color:var(--ink)}
.tl-card-memo{font-size:var(--fs-sm);color:var(--ink-muted);line-height:1.65;white-space:pre-wrap}
.tl-card-moods{display:flex;flex-wrap:wrap;gap:4px}
.tl-card-photos{display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;margin:0 -1.1rem;padding:0 1.1rem}
.tl-card-photos::-webkit-scrollbar{display:none}
.tl-card-photo{width:100px;height:100px;border-radius:var(--r-sm);object-fit:cover;flex-shrink:0;cursor:pointer}
.tl-swiper-footer{display:flex;align-items:center;justify-content:flex-end;padding:.5rem 1rem calc(.7rem + env(safe-area-inset-bottom))}
.tl-swiper-counter{font-size:var(--fs-xs);color:var(--ink-muted);font-weight:600}
.country-chip-lg{display:inline-flex;align-items:center;gap:.35rem;padding:.32rem .8rem;border-radius:var(--r-pill);font-size:var(--fs-md);font-weight:600;background:var(--mint-light);color:var(--primary);margin:.2rem .2rem .2rem 0}
.country-chip-rm{opacity:.5;cursor:pointer;display:inline-flex;align-items:center;width:13px;height:13px;margin-left:.1rem}
.country-chip-rm svg{width:100%;height:100%;fill:currentColor}
</style>
</head>

function migrateTrip(trip){
  if(trip.tripDays)return trip;
  const days=[];
  (trip.countries||[]).forEach(c=>{
    const cDays=c.days||[];
    if(cDays.length){
      cDays.forEach(d=>{
        days.push({dayNum:d.day,date:d.date||'',locationCode:c.code,locationName:d.city||c.name,locationEmoji:c.emoji,locationType:c.type||'country',parentCode:c.parentCode||null,parentName:c.parentName||null,parentEmoji:c.parentEmoji||null,memo:d.memo||'',moods:[],score:null,photos:d.photos||[]});
      });
    } else {
      days.push({dayNum:days.length+1,date:'',locationCode:c.code,locationName:c.name,locationEmoji:c.emoji,locationType:c.type||'country',parentCode:c.parentCode||null,parentName:c.parentName||null,parentEmoji:c.parentEmoji||null,memo:c.memo||'',moods:[...(c.moods||[])],score:c.score||null,photos:[...(c.photos||[])]});
    }
  });
  days.sort((a,b)=>{if(!a.date&&!b.date)return a.dayNum-b.dayNum;if(!a.date)return 1;if(!b.date)return -1;return a.date.localeCompare(b.date);});
  days.forEach((d,i)=>d.dayNum=i+1);
  return{...trip,tripDays:days};
}

function getTripRecs(){
  return [...trips].sort((a,b)=>new Date(b.startDate||b.createdAt)-new Date(a.startDate||a.createdAt)).map(t=>{
    const mt=migrateTrip(t);
    const days=mt.tripDays||[];
    const uniqLocs=[...new Map(days.filter(d=>d.locationCode).map(d=>[d.locationCode,d])).values()];
    const allPhotos=days.flatMap(d=>d.photos||[]);
    const allMoods=[...new Set(days.flatMap(d=>d.moods||[]))];
    const firstLoc=uniqLocs[0];
    const locCountryCode=firstLoc?firstLoc.locationCode.split('_')[0]:null;
    const continent=(COUNTRIES.find(c=>c.code===locCountryCode)||{}).continent||'';
    return{tripId:t.id,tripTitle:t.title,tripEmoji:t.coverEmoji,tripStatus:t.status,startDate:t.startDate,endDate:t.endDate,totalDays:t.totalDays,uniqLocs,allPhotos,allMoods,continent,firstLoc,coverPhoto:t.coverPhoto||null};
  });
}

function makePin(code,borderColor,bgColor,shadow){
  const label=code.slice(0,2).toUpperCase();
  const textColor=borderColor;
  return `<div style="position:relative;width:40px;height:50px;cursor:pointer;filter:drop-shadow(0 3px 8px ${shadow});transition:transform .18s cubic-bezier(.34,1.56,.64,1)" onmouseenter="this.style.transform='scale(1.2) translateY(-3px)'" onmouseleave="this.style.transform='scale(1) translateY(0)'"><div style="position:absolute;top:0;left:0;width:40px;height:40px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${bgColor};border:2.5px solid ${borderColor};box-sizing:border-box"></div><div style="position:absolute;top:0;left:0;width:40px;height:40px;display:flex;align-items:center;justify-content:center;z-index:1"><span style="font-size:10px;font-weight:700;color:${textColor};letter-spacing:-.5px;font-family:'Pretendard','Noto Sans KR',sans-serif">${label}</span></div></div>`;
}
function initMap(){
  if(_map)return;
  _map=L.map("leaflet-map",{zoomControl:true,scrollWheelZoom:true,minZoom:2,maxBounds:[[-85,-180],[85,180]],maxBoundsViscosity:1.0}).setView([20,10],2);
  L.tileLayer("https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png",{attribution:"© Stadia Maps © OpenMapTiles © OpenStreetMap",maxZoom:20,noWrap:true}).addTo(_map);
  updateMapMarkers();
  flyToNearest();
}
function updateMapMarkers(){
  if(!_map)return;
  Object.values(_markers).forEach(m=>m.remove());_markers={};
  _lines.forEach(l=>l.remove());_lines=[];
  const byCode={};
  trips.forEach(t=>{
    const mt=migrateTrip(t);
    const uniq=[...new Map((mt.tripDays||[]).filter(d=>d.locationCode).map(d=>[d.locationCode.split('_')[0],d])).values()];
    uniq.forEach(d=>{
      const code=d.locationCode.split('_')[0];
      const country={code,name:d.locationName,emoji:d.locationEmoji,continent:(COUNTRIES.find(c=>c.code===code)||{}).continent||''};
      if(!byCode[code])byCode[code]={country,trips:[]};byCode[code].trips.push(t);
    });
  });
  const today=new Date().toISOString().slice(0,10);
  Object.entries(byCode).forEach(([code,{country,trips:ct}])=>{
    const coords=COUNTRY_COORDS[code];if(!coords)return;
    const allFuture=ct.every(t=>t.startDate&&t.startDate>today);
    const borderColor=allFuture?"#B0B0B5":CC[country.continent]||DS.gray;
    const bgColor="#fff";
    const shadow=allFuture?"rgba(0,0,0,.10)":"rgba(0,0,0,.18)";
    const colStr=CC[country.continent]||DS.gray;
    const icon=L.divIcon({className:"",html:makePin(code,borderColor,bgColor,shadow),iconSize:[40,50],iconAnchor:[20,50]});
    const mk=L.marker(coords,{icon}).addTo(_map);
    const tripTags=ct.map(t=>`<span class="mp-c" style="background:${colStr+"18"};color:${colStr}" onclick="openModal('${t.id}');closePopup()">${t.coverEmoji||"✈️"} ${t.title}</span>`).join("");
    const doneBtn=ct.length===1?`<button class="mp-open" onclick="openModal('${ct[0].id}');closePopup()">기록 보기 →</button>`:"";
    mk.bindPopup(`<div class="map-popup"><div class="mp-title">${country.emoji} ${country.name}</div><div class="mp-date">${ct.length}번 기록</div><div class="mp-ctags">${tripTags}</div>${doneBtn}</div>`,{maxWidth:230});
    _markers[code]=mk;
  });
  // 여행별 경로 라인 (핀 아래 레이어)
  if(!_map.getPane('routePane')){_map.createPane('routePane');_map.getPane('routePane').style.zIndex=350;}
  trips.forEach(t=>{
    const mt=migrateTrip(t);
    const isFuture=t.startDate&&t.startDate>today;
    const ordered=[...new Map((mt.tripDays||[]).filter(d=>d.locationCode).sort((a,b)=>a.dayNum-b.dayNum).map(d=>[d.locationCode.split('_')[0],d])).values()];
    const pts=ordered.map(d=>COUNTRY_COORDS[d.locationCode.split('_')[0]]).filter(Boolean);
    if(pts.length<2)return;
    const line=L.polyline(pts,{color:isFuture?"#B0B0B5":"#00C896",weight:2,opacity:isFuture?.45:.6,dashArray:"6 5",smoothFactor:1,pane:'routePane'}).addTo(_map);
    _lines.push(line);
  });
}
function flyToTrips(){
  if(!_map)return;
  const done=trips;
  const coords=done.flatMap(t=>{const mt=migrateTrip(t);return[...new Set((mt.tripDays||[]).map(d=>d.locationCode.split('_')[0]).filter(Boolean))].map(c=>COUNTRY_COORDS[c]).filter(Boolean);});
  if(!coords.length)return;
  if(coords.length===1){_map.flyTo(coords[0],5,{duration:0.6});}
  else{_map.flyToBounds(L.latLngBounds(coords),{padding:[40,40],maxZoom:6,duration:0.6});}
}
function flyToNearest(){
  if(!_map)return;
  const done=trips.filter(t=>t.startDate||t.endDate);
  if(!done.length)return;
  done.sort((a,b)=>(b.endDate||b.startDate||"").localeCompare(a.endDate||a.startDate||""));
  const mt0=migrateTrip(done[0]);
  const codes=[...new Set((mt0.tripDays||[]).map(d=>d.locationCode.split('_')[0]).filter(Boolean))];
  const coords=codes.map(c=>COUNTRY_COORDS[c]).filter(Boolean);
  if(!coords.length)return;
  if(coords.length===1){_map.flyTo(coords[0],5,{duration:0.6});}
  else{_map.flyToBounds(L.latLngBounds(coords),{padding:[40,40],maxZoom:5,duration:0.6});}
}

  const tagCloud=(()=>{const entries=Object.entries(mm);if(!entries.length)return"";const sorted=entries.sort((a,b)=>b[1]-a[1]);const maxN=sorted[0][1]||1;const fsTiers=[2.4,1.6,1.15,0.95,0.85,0.78,0.73];const fwTiers=[700,700,600,400,400,400,400];const chips=sorted.map(([m,n],rank)=>{const words=m.split(' ').slice(1).join(' ')||m;const fs=fsTiers[Math.min(rank,fsTiers.length-1)];const fw=fwTiers[Math.min(rank,fwTiers.length-1)];const col='var(--accent)';const op=rank===0?1:rank<=2?0.75:0.5;let ps;if(rank===0){ps="left:48%;top:47%";}else{let ring,idx,cnt;if(rank<=2){ring=0;idx=rank-1;cnt=Math.min(2,sorted.length-1);}else if(rank<=6){ring=1;idx=rank-3;cnt=Math.min(4,sorted.length-3);}else{ring=2;idx=rank-7;cnt=Math.min(6,sorted.length-7);}const rx=[18,28,38][ring];const ry=[14,21,30][ring];const rot=[0.4,0.1,0.6][ring];const ang=-Math.PI/2+rot+(cnt>0?idx/cnt:0)*2*Math.PI;const x=(48+rx*Math.cos(ang)).toFixed(1);const y=(47+ry*Math.sin(ang)).toFixed(1);ps=`left:${x}%;top:${y}%`;}return`<span class="tag-cloud-item" data-rank="${rank}" style="${ps};font-size:${fs}rem;font-weight:${fw};--tc-op:${op};color:${col}">${words}</span>`}).join("");return`<div class="chart-card"><div class="chart-title">여행 선호 태그</div><div class="tag-cloud" style="height:260px">${chips}</div></div>`;})();

      const po=segs.slice().reverse();
      const arcs=po.map(s=>parseFloat(s.dataset.dash));
      const n=po.length;
      const cumStart=[0];
      for(let i=1;i<n;i++)cumStart.push(cumStart[i-1]+arcs[i-1]+GAP);
      const totalSweep=cumStart[n-1]+arcs[n-1];
      po.forEach(s=>{s.style.transition='none';s.style.strokeDasharray=`0 ${DC}`;s.style.strokeDashoffset=topOff+'';});
      let t0=null;
      function frame(now){
        if(!t0)t0=now;
        const elapsed=now-t0-DELAY;
        if(elapsed<0){requestAnimationFrame(frame);return;}
        const raw=Math.min(elapsed/DURATION,1);
        const sw=ease(raw)*totalSweep;
        const fill=arcs.map((a,i)=>Math.max(0,Math.min(sw-cumStart[i],a)));
        const gapP=arcs.map((a,i)=>a>0?Math.min(fill[i]/a,1):1);
        po.forEach((s,i)=>{
          s.style.strokeDasharray=`${fill[i]} ${DC-fill[i]}`;
          let off=topOff;
          for(let j=i;j<n-1;j++)off-=GAP*gapP[j]+fill[j+1];
          s.style.strokeDashoffset=off+'';
        });
        if(raw<1)requestAnimationFrame(frame);
        else po.forEach(s=>{s.style.strokeDasharray=s.dataset.dash;s.style.strokeDashoffset=s.getAttribute('stroke-dashoffset');});
      }
      requestAnimationFrame(frame);
    })();
    // 태그 클라우드: 스크롤로 진입 시 센터부터 순차 reveal
    const cloud=el.querySelector('.tag-cloud');
    if(cloud){
      const items=[...cloud.querySelectorAll('.tag-cloud-item')].sort((a,b)=>+a.dataset.rank-+b.dataset.rank);
      const io=new IntersectionObserver(entries=>{
        if(!entries[0].isIntersecting)return;
        io.disconnect();
        items.forEach((item,i)=>setTimeout(()=>item.classList.add('tc-show'),i*60));
      },{threshold:0.3});
      io.observe(cloud);
    }
  }));
}

function starDisp(score,size){
  const n=Math.round((score||0)/2);
  return `<span class="stars-disp" style="${size?'font-size:'+size:''}">` +
    Array.from({length:5},(_,i)=>i<n?'★':`<span class="empty">★</span>`).join('') +
  `</span>`;
}
function animCount(el){
  const txt=el.textContent.trim();const n=parseFloat(txt);
  if(isNaN(n)||n===0)return;
  const isF=txt.includes('.');const dur=700;const start=performance.now();
  const tick=t=>{const p=Math.min((t-start)/dur,1);const e=1-Math.pow(1-p,3);const v=n*e;
    el.textContent=isF?v.toFixed(1):Math.round(v);if(p<1)requestAnimationFrame(tick);else el.textContent=txt;};
  requestAnimationFrame(tick);
}

function initCarousel(){
  const viewport=document.getElementById('tl-carousel');
  const track=document.getElementById('tl-carousel-track');
  const sliderEl=document.querySelector('.tl-day-slider');
  const sliderTrack=document.querySelector('.tl-slider-track');
  const fill=document.getElementById('tl-slider-fill');
  const pill=document.getElementById('tl-day-pill');
  if(!viewport||!track||!sliderEl||!sliderTrack||!pill)return;
  const cards=[...track.querySelectorAll('.tl-swipe-card')];
  const total=cards.length;if(!total)return;
  const dayNums=(track.dataset.days||'').split(',').map(Number);

  // --- geometry helpers (computed after layout) ---
  function cardStep(){
    if(total<2)return 0;
    const gap=parseFloat(getComputedStyle(track).gap)||12;
    return cards[0].offsetWidth+gap;
  }
  function padL(){return parseFloat(getComputedStyle(track).paddingLeft)||0;}
  function maxOffset(){return -(cardStep()*(total-1));}

  // --- state ---
  let offset=0; // current translateX (0 = first card)
  let currentIdx=0;
  let animId=null;

  // --- render ---
  function applyOffset(x,animated){
    offset=Math.max(maxOffset(),Math.min(0,x));
    if(animated){
      track.style.transition='transform .32s cubic-bezier(0.25,1.0,0.5,1)';
    }else{
      track.style.transition='none';
    }
    track.style.transform=`translateX(${offset}px)`;
    updateSlider();
  }

  function updateSlider(){
    const step=cardStep();
    const frac=step?Math.max(0,Math.min(1,-offset/((total-1)*step))):0;
    const pct=frac*100;
    pill.style.left=pct+'%';
    if(fill)fill.style.width=pct+'%';
    const lo=Math.floor(frac*(total-1));
    const hi=Math.min(lo+1,total-1);
    const t=frac*(total-1)-lo;
    pill.textContent='Day '+(dayNums[t<.5?lo:hi]||1);
  }

  function snapTo(idx,animated=true){
    currentIdx=Math.max(0,Math.min(total-1,idx));
    applyOffset(-cardStep()*currentIdx,animated);
    if(animated){
      const coords=window._mapDayCoords?.[currentIdx];
      const mm=window._modalMap;
      if(mm&&coords)mm.flyTo(coords,5,{animate:true,duration:0.4});
    }
  }

  function nearestIdx(){
    const step=cardStep();
    return step?Math.max(0,Math.min(total-1,Math.round(-offset/step))):0;
  }

  // --- carousel drag ---
  let cDragging=false,cStartX=0,cStartOffset=0,cVelX=0,cLastX=0,cLastT=0;
  function cPointerDown(e){
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    cDragging=true;cStartX=cx;cStartOffset=offset;cVelX=0;cLastX=cx;cLastT=Date.now();
    track.style.transition='none';
    viewport.classList.add('dragging');
    if(!e.touches)e.preventDefault();
  }
  function cPointerMove(e){
    if(!cDragging)return;
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const now=Date.now();
    const dt=now-cLastT||1;
    cVelX=(cx-cLastX)/dt; // px/ms
    cLastX=cx;cLastT=now;
    const dx=cx-cStartX;
    // rubber-band past edges
    let x=cStartOffset+dx;
    const max=maxOffset();
    if(x>0)x=x*0.3;
    else if(x<max)x=max+(x-max)*0.3;
    applyOffset(x,false);
    if(e.touches)e.preventDefault();
  }
  function cPointerUp(){
    if(!cDragging)return;
    cDragging=false;
    viewport.classList.remove('dragging');
    // momentum: if fast flick, advance one card in flick direction
    const step=cardStep();
    let target=nearestIdx();
    if(Math.abs(cVelX)>0.3){
      target=currentIdx+(cVelX>0?-1:1);
    }
    snapTo(target);
  }
  viewport.addEventListener('mousedown',cPointerDown);
  viewport.addEventListener('touchstart',cPointerDown,{passive:false});
  window.addEventListener('mousemove',cPointerMove);
  window.addEventListener('touchmove',cPointerMove,{passive:false});
  window.addEventListener('mouseup',cPointerUp);
  window.addEventListener('touchend',cPointerUp);

  // --- slider drag ---
  let sDragging=false;
  function pctFromE(e){
    const r=sliderTrack.getBoundingClientRect();
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    return Math.max(0,Math.min(1,(cx-r.left)/r.width));
  }
  function sliderMove(e){
    if(!sDragging)return;
    const pct=pctFromE(e);
    // move carousel continuously (no snap while dragging)
    const step=cardStep();
    applyOffset(-pct*(total-1)*step,false);
    if(e.touches)e.preventDefault();
  }
  function sliderUp(){
    if(!sDragging)return;
    sDragging=false;
    snapTo(nearestIdx());
  }
  sliderEl.addEventListener('mousedown',e=>{sDragging=true;sliderMove(e);e.preventDefault();});
  sliderEl.addEventListener('touchstart',e=>{sDragging=true;sliderMove(e);e.preventDefault();},{passive:false});
  window.addEventListener('mousemove',sliderMove);
  window.addEventListener('touchmove',sliderMove,{passive:false});
  window.addEventListener('mouseup',sliderUp);
  window.addEventListener('touchend',sliderUp);

  // expose for map marker clicks
  window._carouselSnap=snapTo;
  window._carouselDayNums=dayNums;

  // initial render
  snapTo(0,false);
}
function initModalMap(trip){
  window._modalMap=null;window._mapDayCoords=[];
  const el=document.getElementById("modal-mini-map");if(!el)return;
  // Leaflet doesn't clean up when the container is replaced via innerHTML.

  const days=(trip.tripDays||[]).filter(d=>d.memo||d.moods?.length||d.photos?.length||d.locationCode);
  // 카드 순서와 동일하게 일자별 coords 배열 구성
  window._mapDayCoords=days.map(d=>{
    const c=d.locationCode?.split("_")[0];
    return c?COUNTRY_COORDS[c]||null:null;
  });
  // 지도용: 연속 중복 제거된 경로 (dayNum, locationName 포함)
  const orderedLocs=[];
  (trip.tripDays||[]).forEach(d=>{
    const c=d.locationCode?.split("_")[0];if(!c)return;
    if(orderedLocs.length&&orderedLocs[orderedLocs.length-1].code===c){

    }else{
      orderedLocs.push({code:c,photo:d.photos?.[0]||null,dayNum:d.dayNum,name:d.locationName||''});
    }
  });
  const locs=orderedLocs.map(l=>({...l,coords:COUNTRY_COORDS[l.code]})).filter(l=>l.coords);
  const coords=locs.map(l=>l.coords);
  const mm=L.map(el,{zoomControl:false,attributionControl:false,dragging:true,scrollWheelZoom:true,touchZoom:true,doubleClickZoom:true,keyboard:false,tap:true});
  window._modalMap=mm;
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png",{maxZoom:19}).addTo(mm);
  if(!coords.length){mm.setView([20,0],2);return;}
  if(coords.length>1)L.polyline(coords,{color:"var(--primary)",weight:2.5,opacity:.8}).addTo(mm);
  const labelStyle=`background:#1D1D1F;color:#fff;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:700;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.3);font-family:Pretendard,sans-serif;letter-spacing:-.01em`;
  const wrapStyle=`display:flex;flex-direction:column;align-items:center;gap:3px`;
  locs.forEach((l)=>{
    const labelText=`Day ${l.dayNum}${l.name?` · ${l.name}`:''}`;
    const label=`<div style="${labelStyle}">${labelText}</div>`;
    let markerHtml,w,h,aX,aY;
    if(l.photo){
      // label≈18px + gap 3px + photo center 18px = anchorY 39
      markerHtml=`<div style="${wrapStyle}">${label}<div style="width:36px;height:36px;border-radius:8px;border:2.5px solid #fff;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.25)"><img src="${l.photo}" style="width:100%;height:100%;object-fit:cover"></div></div>`;
      w=90;h=57;aX=45;aY=39;
    }else{
      // label≈18px + gap 3px + dot center 5px = anchorY 26
      markerHtml=`<div style="${wrapStyle}">${label}<div style="width:10px;height:10px;border-radius:50%;background:#00C896;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25)"></div></div>`;
      w=90;h=31;aX=45;aY=26;
    }
    const icon=L.divIcon({className:"",html:markerHtml,iconSize:[w,h],iconAnchor:[aX,aY]});
    const cardIdx=days.findIndex(d=>d.dayNum===l.dayNum);
    L.marker(l.coords,{icon}).addTo(mm).on('click',()=>{
      if(window._carouselSnap&&cardIdx>=0)window._carouselSnap(cardIdx);
    });
  });
  if(coords.length===1)mm.setView(coords[0],4);
  else mm.fitBounds(L.latLngBounds(coords),{padding:[28,28],maxZoom:7});
}

function compressImage(file,maxW,q){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",q));};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("이미지를 읽을 수 없어요"));};img.src=url;});}

const _CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function _cho(c){const n=c.charCodeAt(0)-0xAC00;return(n>=0&&n<=11171)?_CHO[Math.floor(n/28/21)]:c;}
function _matchKo(name,q){
  if(!q)return false;
  if(name.includes(q))return true;
  const isCon=c=>/[ㄱ-ㅎ]/.test(c);
  for(let i=0;i<=name.length-q.length;i++){
    let ok=true;
    for(let j=0;j<q.length;j++){const qc=q[j];const nc=name[i+j];if(!nc){ok=false;break;}ok=isCon(qc)?_cho(nc)===qc:nc===qc;if(!ok)break;}
    if(ok)return true;
  }
  return false;
}

function removeDayPhoto(idx,pi){formData.tripDays[idx]?.photos?.splice(pi,1);renderForm();}
async function saveTrip(){
  if(!formData.tripDays||!formData.tripDays.length){showToast("날짜별 기록을 추가해요.");return;}
  if(!formData.startDate||!formData.endDate){showToast("날짜를 설정해요.");return;}
  if(!formData.title.trim()){
    const locs=[...new Set(formData.tripDays.filter(d=>d.locationCode).map(d=>d.locationName))];
    formData.title=(locs.slice(0,2).join('·')||'여행')+' '+formData.startDate.slice(0,4);
  }
  calcDays();
  const id=editingId||Date.now()+'_'+Math.random().toString(36).slice(2,5);
  const trip={id,status:formData.status,title:formData.title.trim(),coverEmoji:formData.coverEmoji,startDate:formData.startDate,endDate:formData.endDate,totalDays:formData.totalDays||0,tripDays:formData.tripDays,
    createdAt:editingId?(trips.find(t=>t.id===id)?.createdAt||new Date().toISOString()):new Date().toISOString(),
    updatedAt:new Date().toISOString()};
  trips=editingId?trips.map(t=>t.id===id?trip:t):[trip,...trips];
  await saveToFirestore(trip);renderAll();closeForm();showToast("저장됐어요!");
}
function deleteTrip(id){
  const ov=document.getElementById('confirm-overlay');
  const btn=document.getElementById('confirm-del-btn');
  btn.onclick=()=>{
    const sheet=document.getElementById('confirm-sheet');
    sheet.style.transform='scale(.88) translateY(12px)';sheet.style.opacity='0';
    setTimeout(()=>{ov.style.display='none';trips=trips.filter(t=>t.id!==id);delFromFirestore(id);renderAll();closeForm();closeModal();showToast("삭제됐어요.");},200);
  };
  ov.style.display='flex';
  const sheet=document.getElementById('confirm-sheet');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{sheet.style.transform='scale(1) translateY(0)';sheet.style.opacity='1';}));
}
function resetAllData(){if(!confirm("모든 여행 기록을 삭제하시겠어요? 되돌릴 수 없어요."))return;const k="ta_"+(currentUser?.uid||"g");localStorage.removeItem(k);trips=[];renderAll();showToast("초기화됐어요.");}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500);}
document.addEventListener("click",e=>{if(!e.target.closest(".cs-wrap"))document.querySelectorAll(".cs-dd").forEach(d=>d.style.display="none");});

// ── BOOT ──
(function boot(){
  isAuth=true;currentUser=null;
  trips=loadLocal();

  document.getElementById("pv-avatar").innerHTML=ICON_USER;

})();
