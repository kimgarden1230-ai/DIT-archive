<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIT 아카이브</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  /* Primary – Mint Green */
  --mint-lightest:#EGFBF5;
  --mint-light:#A8EDD8;
  --mint-base:#00C896;
  --mint-hover:#00A87A;
  --mint-dark:#007A5A;
  /* Accent – Coral */
  --coral-light:#FFF0F6;
  --coral-base:#FC4985;
  --coral-dark:#C4176A;
  /* Neutral */
  --ink:#1C1C1E;
  --charcoal:#555555;
  --gray:#ABABAB;
  --fog:#F5F5F5;
  --white:#FFFFFF;
  /* Semantic */
  --border:#E8EDF0;
  --bg:#F5F5F5;
  --surface:#FFFFFF;
  --text:var(--ink);
  --text2:var(--charcoal);
  --muted:var(--gray);
  --primary:var(--mint-base);
  --primary-hover:var(--mint-hover);
  --accent:var(--coral-base);
  /* Radius */
  --r-sm:4px;--r-md:9px;--r-lg:14px;--r-xl:20px;--r-pill:999px;
  /* Shadow */
  --shadow-sm:0 1px 4px rgba(0,0,0,.06);
  --shadow-md:0 4px 16px rgba(0,0,0,.09);
  --shadow-lg:0 8px 32px rgba(0,0,0,.13);
  /* Font */
  --font:'Pretendard','Noto Sans KR',sans-serif;
}
html,body{height:100%;background:var(--bg);font-family:var(--font);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:var(--font);cursor:pointer}
input,textarea,select{font-family:var(--font)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--mint-light);border-radius:var(--r-pill)}

/* ── LANDING ── */
#landing{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;background:linear-gradient(145deg,#F0FBF7 0%,#FFF5FA 45%,#FFFBF0 100%);overflow:hidden}
#landing.hidden{display:none}
.globe-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:.55}
.globe-wrap svg{width:min(80vw,80vh);height:min(80vw,80vh)}
.land-content{position:relative;z-index:1;max-width:400px;width:100%}
.land-wordmark{margin-bottom:2rem}
.land-dit{font-size:clamp(3.2rem,11vw,5.5rem);font-weight:900;letter-spacing:-.06em;line-height:.9;display:block;
  background:linear-gradient(120deg,#42A5F5,#1E88E5,#3949AB,#42A5F5);
  background-size:300% 300%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:ditFlow 8s ease-in-out infinite}
@keyframes ditFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.land-archive{font-size:clamp(3.2rem,11vw,5.5rem);font-weight:900;letter-spacing:-.06em;text-transform:uppercase;display:block;margin-top:.1rem;
  background:linear-gradient(120deg,#FF6B6B,#FC4985,#FF8C42,#FC4985,#FF6B6B);
  background-size:300% 300%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:archiveFlow 10s ease-in-out infinite}
@keyframes archiveFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.land-divider{width:36px;height:2px;background:var(--mint-base);margin:.5rem auto 1.6rem;border-radius:var(--r-pill)}
.land-tagline{font-size:.9rem;color:var(--charcoal);line-height:1.85;margin-bottom:2.4rem;font-weight:400}
.land-btns{display:flex;flex-direction:column;gap:.7rem;align-items:center}
.btn-primary-land{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.82rem 2rem;background:var(--mint-base);border:none;border-radius:var(--r-pill);font-size:.85rem;font-weight:700;color:#fff;width:220px;transition:all .2s;letter-spacing:-.01em}
.btn-primary-land:hover{background:var(--mint-hover);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,200,150,.28)}
.btn-ghost-land{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.78rem 2rem;background:transparent;border:1.5px solid var(--border);border-radius:var(--r-pill);font-size:.82rem;font-weight:500;color:var(--charcoal);width:220px;transition:all .2s}
.btn-ghost-land:hover{border-color:var(--mint-base);color:var(--mint-base)}
.land-notice{font-size:.7rem;color:var(--gray);margin-top:1.1rem;line-height:1.65}

/* ── APP SHELL ── */
#app{display:none;height:100vh;flex-direction:column;overflow:hidden}
#app.active{display:flex}

/* ── TOPBAR ── */
.topbar{height:52px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1rem;gap:.75rem;flex-shrink:0;z-index:200}
.tb-logo{flex-shrink:0;cursor:pointer;line-height:1}
.tb-logo .l1{font-size:.82rem;font-weight:700;color:var(--ink);letter-spacing:-.02em;display:flex;align-items:center;gap:.35rem}
.tb-logo .dot{width:7px;height:7px;border-radius:50%;background:var(--mint-base);display:inline-block;flex-shrink:0}
.tb-logo .l2{font-size:.48rem;color:var(--gray);font-weight:400;letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.view-toggle{display:flex;background:var(--fog);border-radius:var(--r-pill);padding:3px;gap:2px;flex:1;justify-content:center;max-width:300px;margin:0 auto}
.vt-btn{font-size:.68rem;font-weight:600;padding:.3rem .75rem;border-radius:var(--r-pill);border:none;background:none;color:var(--gray);transition:all .15s;white-space:nowrap;flex-shrink:0;letter-spacing:-.01em}
.vt-btn.active{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
.tb-right{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.tb-mode-badge{font-size:.6rem;font-weight:600;padding:.2rem .6rem;border-radius:var(--r-pill);background:var(--fog);color:var(--gray);border:1px solid var(--border)}
.tb-profile{display:flex;align-items:center;gap:.4rem;cursor:pointer;position:relative}
.tb-avatar{width:28px;height:28px;border-radius:50%;background:var(--mint-base);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.6rem;font-weight:700;flex-shrink:0;overflow:hidden}
.tb-avatar img{width:100%;height:100%;object-fit:cover}
.tb-name{font-size:.7rem;font-weight:500;color:var(--charcoal);max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-dropdown{position:absolute;top:calc(100%+8px);right:0;background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);min-width:136px;overflow:hidden;display:none;z-index:300}
.tb-dropdown.show{display:block}
.tb-dropdown button{width:100%;padding:.6rem 1rem;background:none;border:none;font-size:.78rem;font-weight:400;text-align:left;color:var(--charcoal);transition:background .12s}
.tb-dropdown button:hover{background:var(--fog)}

/* ── DEMO BANNER ── */
.demo-lock-banner{display:none;align-items:center;gap:.5rem;padding:.5rem 1.2rem;background:#FFF8F5;border-bottom:1px solid #FFE0D0;font-size:.75rem;color:var(--coral-base);font-weight:500;flex-shrink:0}
.demo-lock-banner.show{display:flex}
.dlb-btn{margin-left:auto;background:var(--coral-base);border:none;color:#fff;font-size:.68rem;font-weight:600;padding:.3rem .9rem;border-radius:var(--r-pill);cursor:pointer}
.dlb-btn:hover{opacity:.88}

/* ── STATS BAR ── */
.stats-bar{display:flex;gap:.4rem;align-items:center;padding:.38rem 1rem;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.sb-item{display:flex;align-items:center;gap:.3rem;font-size:.7rem;font-weight:500;color:var(--charcoal);background:var(--fog);padding:.22rem .65rem;border-radius:var(--r-pill);white-space:nowrap;flex-shrink:0}
.sb-num{color:var(--mint-hover);font-weight:700;font-size:.78rem}
.sb-plan{color:var(--coral-base)!important}

/* ── FAB ── */
.fab{position:fixed;bottom:1.5rem;right:1.5rem;width:48px;height:48px;border-radius:50%;background:var(--mint-base);border:none;color:#fff;font-size:1.4rem;box-shadow:0 4px 16px rgba(0,200,150,.38);transition:all .2s;z-index:150;display:none;align-items:center;justify-content:center}
.fab:hover{background:var(--mint-hover);transform:scale(1.06)}
.fab.show{display:flex}

/* ── MAIN VIEW ── */
#main-view{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.map-panel{flex:0 0 48%;min-height:0;position:relative;overflow:hidden;border-bottom:1px solid var(--border)}
#leaflet-map{width:100%;height:100%}
.map-legend{position:absolute;bottom:10px;left:10px;z-index:400;background:rgba(255,255,255,.96);border:1px solid var(--border);border-radius:var(--r-lg);padding:.42rem .8rem;display:flex;gap:.75rem;box-shadow:var(--shadow-sm)}
.ml-item{display:flex;align-items:center;gap:.3rem;font-size:.65rem;font-weight:500;color:var(--charcoal)}
.ml-dot{width:10px;height:10px;border-radius:50%}
.ml-dot.done{background:var(--mint-base)}
.ml-dot.plan{background:#fff;border:2px dashed var(--coral-base)}
.ml-line{width:16px;height:2px;background:var(--coral-base);border-radius:2px;opacity:.6}

/* ── CARDS PANEL ── */
.cards-panel{flex:1;overflow-y:auto;background:var(--bg);min-height:0}
.cards-header{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1rem .4rem;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border);gap:.5rem;flex-wrap:wrap}
.ch-title{font-size:.72rem;font-weight:600;color:var(--charcoal);white-space:nowrap}
.ch-filter{display:flex;gap:.28rem;flex-wrap:wrap}
.cf-btn{font-size:.65rem;font-weight:500;padding:.22rem .65rem;border-radius:var(--r-pill);border:1.5px solid var(--border);background:#fff;color:var(--gray);cursor:pointer;transition:all .15s}
.cf-btn.on{border-color:var(--mint-base);background:var(--mint-base);color:#fff}
.country-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.75rem;padding:.75rem 1rem 4rem}
/* rec card */
.rec-card{background:#fff;border-radius:var(--r-lg);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:box-shadow .18s,transform .18s;box-shadow:var(--shadow-sm)}
.rec-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.rec-card.is-planning{border:1.5px dashed rgba(255,127,60,.4);background:#fff}
.rc-accent{height:3px}
.rc-thumb{width:100%;height:88px;object-fit:cover;display:block}
.rc-body{padding:.85rem .9rem .8rem}
.rc-top{display:flex;align-items:flex-start;gap:.5rem;margin-bottom:.4rem}
.rc-flag{font-size:1.25rem;line-height:1;flex-shrink:0}
.rc-info{flex:1;min-width:0}
.rc-trip{font-size:.78rem;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.rc-country{font-size:.65rem;font-weight:500;margin-top:.1rem}
.rc-date{font-size:.65rem;color:var(--gray);margin-bottom:.35rem}
.rc-cities{font-size:.65rem;color:var(--charcoal);margin-bottom:.35rem}
.rc-preview{font-size:.72rem;color:var(--charcoal);line-height:1.65;margin-bottom:.35rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc-moods{display:flex;flex-wrap:wrap;gap:.25rem}
.rc-mood{font-size:.6rem;padding:2px 7px;border-radius:var(--r-pill);background:var(--fog);color:var(--charcoal)}
.rc-add-btn{width:100%;margin-top:.5rem;padding:.38rem;background:transparent;border:1.5px dashed rgba(255,127,60,.4);border-radius:var(--r-md);font-size:.7rem;font-weight:600;color:var(--coral-base);cursor:pointer;transition:all .18s}
.rc-add-btn:hover{background:#FFF0EC}
.status-pill{font-size:.6rem;font-weight:600;padding:2px 8px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:3px;margin-bottom:.38rem}
.sp-plan{background:#FFF0EC;color:var(--coral-base);border:1px solid rgba(255,127,60,.25)}
.sp-done{background:rgba(0,200,150,.1);color:var(--mint-hover);border:1px solid rgba(0,200,150,.2)}
.empty-cards{text-align:center;padding:2.5rem 1rem;color:var(--gray);grid-column:1/-1}
.empty-cards .ei{font-size:2rem;margin-bottom:.6rem}

/* ── TIMELINE ── */
#timeline-view{flex:1;overflow-y:auto;padding:1.1rem;display:none;min-height:0}
.tl-section-label{font-size:.65rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);margin-bottom:.6rem;margin-top:.4rem;display:flex;align-items:center;gap:.5rem}
.tl-section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.tl-section-label.plan{color:var(--coral-base)}
.year-section{margin-bottom:2rem}
.year-label{font-size:1.35rem;font-weight:700;color:var(--ink);margin-bottom:.75rem;letter-spacing:-.03em;display:flex;align-items:center;gap:.5rem}
.year-label::after{content:'';flex:1;height:1px;background:var(--border)}
.tl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.75rem}
.tl-card{background:#fff;border-radius:var(--r-lg);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:box-shadow .18s,transform .18s;box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
.tl-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.tl-card.is-planning{border:1.5px dashed rgba(255,127,60,.4)}
.tl-accent{height:3px;flex-shrink:0}
.tl-cover{width:100%;height:120px;object-fit:cover;display:block;flex-shrink:0;object-position:center}
.tl-cover-placeholder{width:100%;height:72px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0;background:var(--fog)}
.tl-body{padding:.85rem .9rem .8rem;flex:1;display:flex;flex-direction:column}
.tl-top{display:flex;align-items:center;gap:.45rem;margin-bottom:.28rem}
.tl-emoji{font-size:1.2rem;line-height:1;flex-shrink:0}
.tl-title{font-size:.88rem;font-weight:600;line-height:1.3;flex:1;color:var(--ink)}
.tl-meta{font-size:.65rem;color:var(--gray);margin-bottom:.38rem}
.tl-ctags{display:flex;flex-wrap:wrap;gap:.22rem;margin-bottom:.38rem}
.tl-ctag{font-size:.62rem;font-weight:500;padding:2px 7px;border-radius:var(--r-pill);background:var(--fog);color:var(--charcoal)}
.tl-moods{display:flex;flex-wrap:wrap;gap:.2rem;margin-bottom:.32rem}
.tl-mood{font-size:.6rem;padding:2px 7px;border-radius:var(--r-pill);background:var(--fog);color:var(--charcoal)}
.tl-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:.35rem}
.tl-score{font-size:.7rem;font-weight:600;color:var(--mint-hover)}
.tl-photo-count{font-size:.62rem;color:var(--gray)}
.tl-add-btn{width:100%;margin-top:.5rem;padding:.38rem;background:transparent;border:1.5px dashed rgba(255,127,60,.4);border-radius:var(--r-md);font-size:.7rem;font-weight:600;color:var(--coral-base);cursor:pointer;transition:all .18s}
.tl-add-btn:hover{background:#FFF0EC}

/* ── STATS ── */
#stats-view{flex:1;overflow-y:auto;padding:1rem;display:none;min-height:0;background:var(--bg)}
.stats-hero{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:.75rem}
.sh-card{border-radius:var(--r-lg);padding:1rem 1.1rem;position:relative;overflow:hidden;height:84px;display:flex;flex-direction:column;justify-content:center;background:#fff;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.sh-val{font-size:1.8rem;font-weight:700;color:var(--ink);line-height:1;letter-spacing:-.03em}
.sh-label{font-size:.65rem;font-weight:500;color:var(--charcoal);margin-top:.22rem}
.sh-icon{position:absolute;bottom:.7rem;right:.9rem;font-size:1.3rem;opacity:.1;line-height:1}
.chart-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:1rem 1.1rem;margin-bottom:.65rem;box-shadow:var(--shadow-sm)}
.chart-title{font-size:.7rem;font-weight:600;color:var(--charcoal);margin-bottom:.85rem}
/* bar */
.u-bar-row{display:flex;align-items:center;gap:.55rem;margin-bottom:.48rem}
.u-bar-row:last-child{margin-bottom:0}
.u-bar-left{font-size:.72rem;font-weight:400;color:var(--charcoal);flex-shrink:0;line-height:1.2}
.u-bar-track{flex:1;height:8px;background:var(--fog);border-radius:var(--r-pill);overflow:hidden}
.u-bar-fill{height:8px;border-radius:var(--r-pill);transition:width .5s cubic-bezier(.34,1.2,.64,1)}
.u-bar-right{font-size:.72rem;font-weight:600;color:var(--ink);width:16px;text-align:right;flex-shrink:0}
/* donut */
.donut-wrap{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.donut-legend{display:flex;flex-direction:column;gap:.5rem;flex:1;min-width:0}
.dl-item{display:flex;align-items:center;gap:.45rem}
.dl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dl-name{font-size:.72rem;font-weight:400;color:var(--charcoal);width:52px;flex-shrink:0}
.s-bar-track{flex:1;height:8px;background:var(--fog);border-radius:var(--r-pill);overflow:hidden}
.s-bar-fill{height:8px;border-radius:var(--r-pill);transition:width .5s cubic-bezier(.34,1.2,.64,1)}
.s-bar-val{font-size:.72rem;font-weight:600;color:var(--ink);width:16px;text-align:right;flex-shrink:0}
/* top countries */
.top-country-row{display:flex;align-items:center;gap:.65rem;padding:.5rem 0;border-bottom:1px solid var(--border)}
.top-country-row:last-child{border-bottom:none;padding-bottom:0}
.tcr-rank{font-size:.65rem;font-weight:600;color:var(--gray);width:14px;text-align:center;flex-shrink:0}
.tcr-badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#fff;flex-shrink:0}
.tcr-info{flex:1;min-width:0}
.tcr-name{font-size:.78rem;font-weight:600;color:var(--ink)}
.tcr-sub{font-size:.65rem;font-weight:400;color:var(--gray);margin-top:.04rem}
.tcr-score{font-size:.72rem;font-weight:600;color:var(--charcoal);flex-shrink:0}
.photo-mosaic{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-radius:var(--r-md);overflow:hidden}
.photo-mosaic img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;transition:opacity .15s}
.photo-mosaic img:hover{opacity:.85}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;z-index:500;background:rgba(28,28,30,.45);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-bg.open{opacity:1;pointer-events:all}
@media(min-width:600px){.modal-bg{align-items:center;padding:1.5rem}}
.modal{background:#fff;border-radius:var(--r-xl) var(--r-xl) 0 0;width:100%;max-width:620px;max-height:92vh;overflow-y:auto;transform:translateY(24px);transition:transform .3s cubic-bezier(.34,1.4,.64,1);overscroll-behavior:contain}
@media(min-width:600px){.modal{border-radius:var(--r-xl);transform:translateY(12px) scale(.97)}}
.modal-bg.open .modal{transform:translateY(0) scale(1)}
.modal-accent{height:4px}
.modal-head{padding:.9rem 1.2rem .7rem;display:flex;align-items:flex-start;gap:.65rem;position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);z-index:2}
.mh-emoji{font-size:1.6rem;line-height:1}
.mh-info{flex:1;min-width:0}
.mh-title{font-size:1rem;font-weight:700;margin-bottom:.1rem;line-height:1.3;color:var(--ink);letter-spacing:-.02em}
.mh-meta{font-size:.65rem;color:var(--gray);display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.mh-status{font-size:.6rem;font-weight:600;padding:2px 8px;border-radius:var(--r-pill)}
.mh-actions{display:flex;align-items:center;gap:.4rem;flex-shrink:0}
.mh-share-btn{background:var(--fog);border:1px solid var(--border);border-radius:var(--r-md);padding:.3rem .65rem;font-size:.68rem;font-weight:600;color:var(--charcoal);transition:all .15s}
.mh-share-btn:hover{border-color:var(--mint-base);color:var(--mint-base)}
.mh-close{background:none;border:none;font-size:.95rem;color:var(--gray);padding:.15rem;line-height:1}
.modal-tabs{display:flex;border-bottom:1px solid var(--border);background:#fff;padding:0 1.2rem;position:sticky;top:60px;z-index:1;overflow-x:auto}

.modal-body{padding:.85rem 1.2rem 1.4rem}
.country-tabs{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.9rem}
.ct-btn{font-size:.7rem;font-weight:600;padding:.32rem .85rem;border-radius:var(--r-pill);border:1.5px solid var(--border);background:#fff;color:var(--charcoal);cursor:pointer;transition:all .15s}

.sec-lbl{font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:.38rem;color:var(--gray)}

.cmp-lbl{font-size:.6rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.4rem;display:block}

.cmp-txt{font-size:.78rem;color:var(--charcoal);line-height:1.7;white-space:pre-wrap}

.sbl{font-size:.62rem;font-weight:600;color:var(--charcoal);white-space:nowrap}

.sbf{height:100%;border-radius:var(--r-pill);background:var(--mint-base);transition:width .4s ease}

.insight-row{background:#fff;border:1px solid rgba(0,200,150,.2);border-left:3px solid var(--mint-base);border-radius:var(--r-md);padding:.5rem .7rem;margin-top:.38rem}
.ins-lbl{font-size:.58rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mint-hover);margin-bottom:.2rem}
.ins-txt{font-size:.76rem;color:var(--charcoal);line-height:1.65}

.qr-fi{margin-bottom:.7rem}

@keyframes spin{to{transform:rotate(360deg)}}
/* photos */
.photo-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:.9rem;border-radius:var(--r-lg);overflow:hidden}
.photo-gallery img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;transition:opacity .15s}
.photo-gallery img:hover{opacity:.85}
.photo-gallery-empty{background:var(--fog);border-radius:var(--r-lg);padding:1.5rem;text-align:center;color:var(--gray);font-size:.78rem;margin-bottom:.9rem}
.photo-upload-area{border:1.5px dashed var(--border);border-radius:var(--r-lg);padding:.9rem;text-align:center;cursor:pointer;transition:all .18s;background:#fafafa}
.photo-upload-area:hover{border-color:var(--mint-base);background:rgba(0,200,150,.03)}
.photo-upload-area input{display:none}
.pua-icon{font-size:1.2rem;margin-bottom:.25rem}
.pua-text{font-size:.72rem;color:var(--gray)}
.pua-text strong{color:var(--mint-hover)}
/* share */
.share-panel{padding:1.1rem 1.2rem 1.4rem}
.share-title{font-size:.88rem;font-weight:700;color:var(--ink);margin-bottom:.9rem;letter-spacing:-.02em}
.share-btns{display:flex;flex-direction:column;gap:.55rem}
.share-btn{display:flex;align-items:center;gap:.7rem;padding:.75rem .95rem;background:var(--fog);border:1px solid var(--border);border-radius:var(--r-lg);font-size:.8rem;font-weight:600;color:var(--ink);transition:all .18s}
.share-btn:hover{border-color:var(--mint-base);background:rgba(0,200,150,.04)}
.share-btn-icon{font-size:1.2rem;width:26px;text-align:center;flex-shrink:0}
.share-btn-desc{font-size:.65rem;font-weight:400;color:var(--gray);display:block;margin-top:.08rem}

/* ── FORM ── */
#form-view{flex:1;overflow-y:auto;display:none;flex-direction:column;min-height:0}
.form-topbar{height:52px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.1rem;gap:.65rem;flex-shrink:0;position:sticky;top:0;z-index:100}
.ftb-back{background:none;border:none;font-size:.78rem;font-weight:500;color:var(--charcoal);display:flex;align-items:center;gap:.25rem;letter-spacing:-.01em}
.ftb-back:hover{color:var(--ink)}
.ftb-title{font-size:.88rem;font-weight:600;flex:1;color:var(--ink);letter-spacing:-.02em}
.ftb-save{background:var(--mint-base);color:#fff;border:none;padding:.4rem 1.1rem;border-radius:var(--r-pill);font-size:.76rem;font-weight:700;transition:opacity .15s}
.ftb-save:hover{background:var(--mint-hover)}
.form-body{max-width:640px;margin:0 auto;padding:1rem;width:100%;padding-bottom:3rem}
/* accordion */
.acc-section{background:#fff;border-radius:var(--r-lg);border:1px solid var(--border);margin-bottom:.6rem;overflow:hidden;box-shadow:var(--shadow-sm)}
.acc-header{display:flex;align-items:center;padding:.8rem 1rem;cursor:pointer;gap:.55rem;user-select:none;transition:background .12s}
.acc-header:hover{background:var(--fog)}
.acc-icon{font-size:.95rem;width:22px;text-align:center;flex-shrink:0}
.acc-title{font-size:.82rem;font-weight:600;flex:1;color:var(--ink);letter-spacing:-.01em}
.acc-subtitle{font-size:.68rem;color:var(--gray);margin-right:.4rem}
.acc-chevron{color:var(--gray);font-size:.62rem;transition:transform .2s;flex-shrink:0}
.acc-chevron.open{transform:rotate(180deg)}
.acc-body{padding:0 1rem .9rem;display:none}
.acc-body.open{display:block}
/* status toggle */
.status-toggle{display:flex;border:1.5px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:.55rem}
.st-btn{flex:1;padding:.55rem;background:#fff;border:none;font-size:.78rem;font-weight:600;color:var(--charcoal);transition:all .18s;text-align:center;line-height:1.4}
.st-btn small{display:block;font-size:.6rem;font-weight:400;opacity:.65;margin-top:1px}
.st-btn.plan-on{background:var(--coral-base);color:#fff}
.st-btn.done-on{background:var(--mint-base);color:#fff}
.phase-note{font-size:.68rem;color:var(--gray);line-height:1.65;padding:.38rem .52rem;background:var(--fog);border-radius:var(--r-md);margin-bottom:.4rem}
/* fields */
.fi{margin-bottom:.7rem}
.fi label{font-size:.65rem;font-weight:600;letter-spacing:.04em;color:var(--gray);text-transform:uppercase;display:block;margin-bottom:.28rem}
.fi input,.fi textarea{width:100%;padding:.52rem .72rem;border:1.5px solid var(--border);border-radius:var(--r-md);font-size:.82rem;outline:none;color:var(--ink);background:#fff;transition:border-color .15s;line-height:1.6}
.fi input:focus,.fi textarea:focus{border-color:var(--mint-base)}
.fi textarea{resize:vertical;min-height:66px}
.fi-row{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:.7rem}
.emoji-grid{display:flex;flex-wrap:wrap;gap:.32rem;margin-bottom:.7rem}
.eg-btn{font-size:1rem;padding:.26rem .32rem;border-radius:var(--r-sm);border:1.5px solid var(--border);background:#fff;cursor:pointer;transition:all .12s}
.eg-btn.on{border-color:var(--mint-base);background:rgba(0,200,150,.08)}
/* country search */
.cs-wrap{position:relative;margin-bottom:.65rem}
.cs-inp{width:100%;padding:.52rem .72rem;border:1.5px solid var(--border);border-radius:var(--r-md);font-size:.82rem;outline:none;color:var(--ink);background:#fff;transition:border-color .15s}
.cs-inp:focus{border-color:var(--mint-base)}
.cs-dd{position:absolute;top:calc(100%+3px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);z-index:300;max-height:200px;overflow-y:auto;display:none}
.cs-item{padding:.48rem .78rem;cursor:pointer;display:flex;align-items:center;gap:.52rem;font-size:.8rem;border-bottom:1px solid var(--fog);transition:background .1s}
.cs-item:hover{background:var(--fog)}
.sel-countries{display:flex;flex-wrap:wrap;gap:.32rem;margin-bottom:.65rem}
.sel-c{display:inline-flex;align-items:center;gap:.32rem;padding:.25rem .62rem;border-radius:var(--r-pill);font-size:.7rem;font-weight:600;background:rgba(0,200,150,.1);color:var(--mint-hover)}
.sel-c span{opacity:.5;cursor:pointer}
/* country accordion */
.country-acc{border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:.55rem;overflow:hidden}
.country-acc-header{display:flex;align-items:center;padding:.65rem .85rem;cursor:pointer;gap:.45rem;background:var(--fog);transition:background .12s}
.country-acc-header:hover{background:#ebebeb}
.cah-flag{font-size:1rem}
.cah-name{font-size:.8rem;font-weight:600;flex:1;color:var(--ink)}
.cah-status{font-size:.6rem;color:var(--gray)}
.cah-chevron{color:var(--gray);font-size:.6rem;transition:transform .2s}
.cah-chevron.open{transform:rotate(180deg)}
.country-acc-body{padding:.75rem .85rem;display:none;border-top:1px solid var(--border)}
.country-acc-body.open{display:block}
/* photo upload */
.photo-preview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:.7rem}
.photo-preview-item{position:relative;border-radius:var(--r-md);overflow:hidden}
.photo-preview-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.photo-del-btn{position:absolute;top:3px;right:3px;width:17px;height:17px;background:rgba(0,0,0,.55);border:none;border-radius:50%;color:#fff;font-size:.5rem;display:flex;align-items:center;justify-content:center;cursor:pointer}
/* mood */
.mood-sel{display:flex;flex-wrap:wrap;gap:.32rem}
.ms-btn{font-size:.7rem;padding:.26rem .68rem;border-radius:var(--r-pill);border:1.5px solid var(--border);background:#fff;color:var(--charcoal);cursor:pointer;transition:all .12s}
.ms-btn.on{border-color:var(--mint-base);background:rgba(0,200,150,.08);color:var(--mint-hover)}
.score-wrap{display:flex;align-items:center;gap:.65rem}
input[type=range]{flex:1;accent-color:var(--mint-base)}
.del-btn{width:100%;padding:.5rem;background:rgba(255,127,60,.08);border:1px solid rgba(255,127,60,.25);border-radius:var(--r-md);color:var(--coral-base);font-size:.76rem;font-weight:600;cursor:pointer;transition:all .15s}
.del-btn:hover{background:rgba(255,127,60,.15)}

/* share card */
#share-card{position:fixed;left:-9999px;top:0;width:480px;background:#fff;font-family:var(--font);border-radius:var(--r-xl);overflow:hidden;z-index:-1}
.sc-header{padding:1.3rem 1.5rem .9rem;background:var(--mint-base)}
.sc-emoji{font-size:2rem;margin-bottom:.35rem;display:block}
.sc-title{font-size:1.25rem;font-weight:700;color:#fff;margin-bottom:.18rem;letter-spacing:-.03em}
.sc-dates{font-size:.75rem;color:rgba(255,255,255,.7)}
.sc-body{padding:.9rem 1.5rem 1.2rem}
.sc-countries-row{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.8rem}
.sc-ctag{font-size:.68rem;font-weight:600;padding:.28rem .65rem;border-radius:var(--r-pill);background:var(--fog);color:var(--charcoal)}
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:.8rem}
.sc-item{background:var(--fog);border-radius:var(--r-md);padding:.55rem .65rem}
.sc-item-label{font-size:.55rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);margin-bottom:.18rem}
.sc-item-val{font-size:.8rem;font-weight:700;color:var(--ink)}
.sc-score-row{display:flex;align-items:center;gap:.55rem}
.sc-score-label{font-size:.65rem;font-weight:600;color:var(--gray)}
.sc-score-bar{flex:1;height:5px;background:var(--border);border-radius:var(--r-pill);overflow:hidden}
.sc-score-fill{height:100%;border-radius:var(--r-pill);background:var(--mint-base)}
.sc-score-val{font-size:.78rem;font-weight:700;color:var(--mint-hover)}
.sc-footer{padding:.65rem 1.5rem;background:var(--fog);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sc-footer-logo{font-size:.65rem;font-weight:700;color:var(--mint-hover)}
.sc-footer-sub{font-size:.58rem;color:var(--gray)}

/* lightbox */
#lightbox{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center}
#lightbox.open{display:flex}
#lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:var(--r-md)}
#lightbox-close{position:absolute;top:1rem;right:1rem;background:rgba(255,255,255,.12);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:.9rem;cursor:pointer}

/* map */
.map-popup{font-family:var(--font);min-width:185px}
.mp-title{font-size:.86rem;font-weight:700;margin-bottom:.12rem;color:var(--ink)}
.mp-date{font-size:.62rem;color:var(--gray);margin-bottom:.42rem}
.mp-ctags{display:flex;flex-wrap:wrap;gap:.22rem;margin-bottom:.5rem}
.mp-c{font-size:.62rem;padding:2px 7px;border-radius:var(--r-pill);font-weight:600;cursor:pointer}
.mp-open{width:100%;padding:.38rem;background:var(--mint-base);border:none;border-radius:var(--r-md);color:#fff;font-family:var(--font);font-size:.7rem;font-weight:600;cursor:pointer;margin-bottom:.28rem;transition:opacity .15s}
.mp-open:hover{opacity:.85}
.mp-reality{width:100%;padding:.36rem;background:var(--fog);border:1px solid var(--border);border-radius:var(--r-md);color:var(--coral-base);font-family:var(--font);font-size:.7rem;font-weight:600;cursor:pointer;transition:all .15s}
.mp-reality:hover{border-color:var(--coral-base)}
.leaflet-popup-content-wrapper{border-radius:var(--r-lg)!important;border:1px solid var(--border);font-family:var(--font);box-shadow:var(--shadow-md)!important}
.leaflet-popup-content{margin:12px 13px!important}

/* toast */
.toast{position:fixed;bottom:4.5rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.5rem 1.1rem;border-radius:var(--r-pill);font-size:.78rem;font-weight:500;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow-md)}
.toast.show{opacity:1}
</style>
</head>

<!-- LANDING -->
<div id="landing">
  <div class="globe-wrap">
    <svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
      <defs>

          <stop offset="100%" stop-color="#A8EDD8" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <ellipse cx="300" cy="300" rx="240" ry="155" fill="none" stroke="#FFD166" stroke-width=".9"  opacity=".5"/>
      <ellipse cx="300" cy="300" rx="240" ry="220" fill="none" stroke="#34D399" stroke-width=".8"  opacity=".45"/>
      <line x1="60" y1="300" x2="540" y2="300" stroke="#FF8EC4" stroke-width=".9" opacity=".45"/>
      <line x1="300" y1="60"  x2="300" y2="540" stroke="#FFE066" stroke-width=".8" opacity=".4"/>
      <!-- 경도선 -->
      <ellipse id="lon0" cx="300" cy="300" rx="0"   ry="240" fill="none" stroke="#00C896" stroke-width="1"  opacity=".6"/>
      <ellipse id="lon1" cx="300" cy="300" rx="120" ry="240" fill="none" stroke="#FC4985" stroke-width=".9" opacity=".5"/>
      <ellipse id="lon2" cx="300" cy="300" rx="200" ry="240" fill="none" stroke="#FFD166" stroke-width=".8" opacity=".5"/>
      <ellipse id="lon3" cx="300" cy="300" rx="240" ry="240" fill="none" stroke="#34D399" stroke-width=".7" opacity=".45"/>
      <ellipse id="lon4" cx="300" cy="300" rx="200" ry="240" fill="none" stroke="#FF8EC4" stroke-width=".8" opacity=".5"/>
      <ellipse id="lon5" cx="300" cy="300" rx="120" ry="240" fill="none" stroke="#00A87A" stroke-width=".9" opacity=".5"/>

function initFirebase(){
  try{
    if(FIREBASE_CONFIG.apiKey==="YOUR_API_KEY")throw new Error("nc");
    if(!window.firebase)return false;
    firebase.initializeApp(FIREBASE_CONFIG);
    auth=firebase.auth();db=firebase.firestore();
    auth.onAuthStateChanged(u=>{if(u){currentUser=u;isDemo=false;isAuth=true;enterApp();}else if(!isDemo)showLanding();});
    return true;
  }catch{return false;}
}
function signInGoogle(){
  if(!auth){
    isDemo=false;isAuth=false;currentUser={displayName:"사용자",photoURL:null};trips=[];
    showToast("Firebase 미설정 — 빈 아카이브로 시작합니다");
    setTimeout(()=>{
      document.getElementById("landing").classList.add("hidden");
      document.getElementById("app").classList.add("active");
      setUserUI();
      document.getElementById("demo-banner").classList.remove("show");
      document.getElementById("tb-mode-badge").style.display="none";
      document.getElementById("dd-logout").style.display="block";
      document.getElementById("dd-login").style.display="none";
      document.getElementById("fab-btn").classList.add("show");
      renderAll();setTimeout(initMap,120);openForm(null);
    },400);return;
  }
  const p=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(p).catch(e=>{console.warn(e);showToast("로그인 실패.");});
}
function doSignOut(){if(auth&&isAuth)auth.signOut();isDemo=false;isAuth=false;currentUser=null;trips=[];showLanding();}

function setUserUI(){
  const av=document.getElementById("tb-avatar");
  if(currentUser?.photoURL)av.innerHTML=`<img src="${currentUser.photoURL}">`;
  else{
    const name=currentUser?.displayName||"User";
    const initials=name.match(/[a-zA-Z]/g)
      ?name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase()
      :name[0];
    av.textContent=initials;

async function loadFromFirestore(){try{const snap=await db.collection("users").doc(currentUser.uid).collection("trips").orderBy("createdAt","desc").get();trips=snap.docs.map(d=>({id:d.id,...d.data()}));}catch{trips=loadLocal();}}
async function saveToFirestore(trip){if(!db||!isAuth){saveLocal(trip);return;}try{await db.collection("users").doc(currentUser.uid).collection("trips").doc(trip.id).set(trip);}catch{saveLocal(trip);}}
async function delFromFirestore(id){if(!db||!isAuth){delLocal(id);return;}try{await db.collection("users").doc(currentUser.uid).collection("trips").doc(id).delete();}catch{delLocal(id);}}
function saveLocal(trip){const k="ta_"+(currentUser?.uid||"g");const a=loadLocal().filter(t=>t.id!==trip.id);a.push(trip);try{localStorage.setItem(k,JSON.stringify(a));}catch{showToast("저장 공간 부족");}}
function delLocal(id){const k="ta_"+(currentUser?.uid||"g");localStorage.setItem(k,JSON.stringify(loadLocal().filter(t=>t.id!==id)));}
function loadLocal(){try{return JSON.parse(localStorage.getItem("ta_"+(currentUser?.uid||"g"))||"[]");}catch{return [];}}

function getCountryRecs(){
  const recs=[];
  [...trips].sort((a,b)=>new Date(b.startDate||b.createdAt)-new Date(a.startDate||a.createdAt))
    .forEach(t=>t.countries.forEach(c=>recs.push({tripId:t.id,tripTitle:t.title,tripEmoji:t.coverEmoji,tripStatus:t.status,startDate:t.startDate,endDate:t.endDate,...c})));
  return recs;
}
function setCF(cont,btn){cfFilter=cont;document.querySelectorAll(".cf-btn").forEach(b=>b.classList.remove("on"));btn.classList.add("on");renderCountryCards();}
function renderCountryCards(){

function makePin(code,borderColor,bgColor,shadow,isPlan){
  const label=code.slice(0,2).toUpperCase();
  const textColor=isPlan?DS.coral:borderColor;
  return `<div style="position:relative;width:40px;height:50px;cursor:pointer;filter:drop-shadow(0 3px 8px ${shadow});transition:transform .18s cubic-bezier(.34,1.56,.64,1)" onmouseenter="this.style.transform='scale(1.2) translateY(-3px)'" onmouseleave="this.style.transform='scale(1) translateY(0)'"><div style="position:absolute;top:0;left:0;width:40px;height:40px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${bgColor};border:2.5px solid ${borderColor};box-sizing:border-box"></div><div style="position:absolute;top:0;left:0;width:40px;height:40px;display:flex;align-items:center;justify-content:center;z-index:1"><span style="font-size:10px;font-weight:700;color:${textColor};letter-spacing:-.5px;font-family:'Pretendard','Noto Sans KR',sans-serif">${label}</span></div></div>`;
}
function initMap(){
  if(_map)return;
  _map=L.map("leaflet-map",{zoomControl:true,scrollWheelZoom:true}).setView([20,10],2);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{attribution:"© OpenStreetMap © CARTO",maxZoom:19,subdomains:"abcd"}).addTo(_map);
  updateMapMarkers();
}
function updateMapMarkers(){
  if(!_map)return;
  Object.values(_markers).forEach(m=>m.remove());_markers={};
  _routes.forEach(r=>r.remove());_routes=[];
  trips.filter(t=>t.status==="planning").forEach(t=>{
    const coords=t.countries.map(c=>COUNTRY_COORDS[c.code]).filter(Boolean);
    if(coords.length<2)return;
    _routes.push(L.polyline(coords,{color:DS.coral,weight:2,opacity:.6,dashArray:"7 5"}).addTo(_map));
  });
  const byCode={};
  trips.forEach(t=>t.countries.forEach(c=>{if(!byCode[c.code])byCode[c.code]={country:c,trips:[]};byCode[c.code].trips.push(t);}));
  Object.entries(byCode).forEach(([code,{country,trips:ct}])=>{
    const coords=COUNTRY_COORDS[code];if(!coords)return;
    const hasDone=ct.some(t=>t.status!=="planning");
    const isPlanOnly=!hasDone;
    const borderColor=isPlanOnly?DS.coral:(CC[country.continent]||DS.gray);
    const bgColor="#fff";
    const shadow=isPlanOnly?"rgba(255,127,60,.3)":"rgba(0,0,0,.18)";
    const colStr=isPlanOnly?DS.coral:(CC[country.continent]||DS.gray);
    const icon=L.divIcon({className:"",html:makePin(code,borderColor,bgColor,shadow,isPlanOnly),iconSize:[40,50],iconAnchor:[20,50]});
    const mk=L.marker(coords,{icon}).addTo(_map);
    const tripTags=ct.map(t=>{const ip=t.status==="planning";return `<span class="mp-c" style="background:${ip?"rgba(255,127,60,.1)":colStr+"18"};color:${ip?DS.coral:colStr}" onclick="openModal('${t.id}');closePopup()">${t.coverEmoji||"✈️"} ${t.title}</span>`;}).join("");
    const planTrip=ct.find(t=>t.status==="planning");
    const doneBtn=ct.length===1&&!planTrip?`<button class="mp-open" onclick="openModal('${ct[0].id}');closePopup()">기록 보기 →</button>`:"";
    const planBtn=planTrip?`<button class="mp-reality" onclick="openModal('${planTrip.id}',true);closePopup()">현실 기록하기</button>`:"";
    mk.bindPopup(`<div class="map-popup"><div class="mp-title">${country.emoji} ${country.name}</div><div class="mp-date">${ct.length}번 기록</div><div class="mp-ctags">${tripTags}</div>${doneBtn}${planBtn}</div>`,{maxWidth:230});
    _markers[code]=mk;
  });
}
function closePopup(){if(_map)_map.closePopup();}

function tlCard(t,isPlan){

function openModal(id,goToReality){

  document.getElementById("modal-inner").innerHTML=buildModal(t);

function buildModal(t){
  const isPlan=t.status==="planning";

  const statusHtml=isPlan?`<span class="mh-status" style="background:#FFF0EC;color:${DS.coral};border:1px solid rgba(255,127,60,.25)">계획 중</span>`:`<span class="mh-status" style="background:rgba(0,200,150,.1);color:${DS.mintHover};border:1px solid rgba(0,200,150,.2)">완료</span>`;
  const shareBtn=(!isPlan&&isAuth)?`<button class="mh-share-btn" onclick="openSharePanel('${t.id}')">↗ 공유</button>`:"";

  const aiClick=isPlan?`showToast('여행 완료 후 AI 회고를 사용할 수 있어요')`:`switchMT('${t.id}','ai')`;
  const tabs=`<div class="modal-tabs"><button class="mt-btn${curModalTab==="overview"?" active":""}" onclick="switchMT('${t.id}','overview')">개요</button><button class="mt-btn${curModalTab==="compare"?" active":""}" onclick="switchMT('${t.id}','compare')">기대↔현실</button><button class="mt-btn${curModalTab==="photos"?" active":""}" onclick="switchMT('${t.id}','photos')">사진</button><button class="mt-btn${curModalTab==="ai"?" active":""}${isPlan?" style='opacity:.4'":""}" onclick="${aiClick}">AI 회고</button>${curModalTab==="share"?`<button class="mt-btn active">공유</button>`:""}</div>`;
  let content="";
  if(curModalTab==="overview")content=buildOverviewTab(t);

  else if(curModalTab==="photos")content=buildPhotosTab(t);
  else if(curModalTab==="share")content=buildShareTab(t);

  return head+tabs+content;

function buildInlineRealityForm(tid,code,d){

function qrUpd(tid,code,field,val){if(!qrData[tid])qrData[tid]={};if(!qrData[tid][code])qrData[tid][code]={reality:"",insight:"",memo:"",moods:[],score:7};qrData[tid][code][field]=val;}
function qrToggleMood(tid,code,m){if(!qrData[tid]||!qrData[tid][code])return;const ms=qrData[tid][code].moods||[];qrData[tid][code].moods=ms.includes(m)?ms.filter(x=>x!==m):[...ms,m];const t=trips.find(x=>x.id===tid);if(t)document.getElementById("modal-inner").innerHTML=buildModal(t);}
async function saveQR(tid,code){
  if(isDemo){showToast("예시 모드에서는 저장이 안 돼요");return;}

  if(t.countries.every(c=>c.reality))t.status="completed";

  try{

  document.getElementById("modal-inner").innerHTML=buildModal(t);
}
function compressImage(file,maxW,q){return new Promise(res=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",q));};img.src=url;});}
function openLightbox(src){document.getElementById("lightbox-img").src=src;document.getElementById("lightbox").classList.add("open");}
function closeLightbox(){document.getElementById("lightbox").classList.remove("open");}
document.getElementById("lightbox").addEventListener("click",e=>{if(e.target===document.getElementById("lightbox"))closeLightbox();});

// ── FORM ──
function fabClick(){if(isDemo){showToast("기록을 남기려면 로그인이 필요해요");return;}openForm(null);}
function openForm(id){
  if(isDemo){showToast("기록을 남기려면 로그인이 필요해요");return;}
  editingId=id;accOpenSections=new Set(["status","basic","countries"]);
  ["main-view","timeline-view","stats-view"].forEach(v=>document.getElementById(v).style.display="none");
  document.getElementById("fab-btn").classList.remove("show");
  const fv=document.getElementById("form-view");fv.style.display="flex";fv.style.flexDirection="column";
  document.getElementById("form-title").textContent=id?"여행 기록 편집":"새 여행 기록";
  if(id){
    const t=trips.find(x=>x.id===id);
    formData={status:t.status||"planning",title:t.title||"",coverEmoji:t.coverEmoji||"✈️",startDate:t.startDate||"",endDate:t.endDate||"",totalDays:t.totalDays||0,countries:[...t.countries.map(c=>({...c}))],entries:{}};
    t.countries.forEach(c=>{formData.entries[c.code]={cities:c.cities||"",expect:c.expect||"",reality:c.reality||"",insight:c.insight||"",memo:c.memo||"",moods:[...(c.moods||[])],score:c.score||7,photos:[...(c.photos||[])]};});
  }else{formData={status:"planning",title:"",coverEmoji:"✈️",startDate:"",endDate:"",totalDays:0,countries:[],entries:{}};}
  renderForm();
}
function closeForm(){document.getElementById("form-view").style.display="none";if(isAuth)document.getElementById("fab-btn").classList.add("show");switchView(currentView);}
function setStatus(s){formData.status=s;renderForm();}
function toggleAcc(key){if(accOpenSections.has(key))accOpenSections.delete(key);else accOpenSections.add(key);renderForm();}
function toggleCountryAcc(code){const k="c_"+code;if(accOpenSections.has(k))accOpenSections.delete(k);else accOpenSections.add(k);renderForm();}
function renderForm(){
  const fb=document.getElementById("form-body");
  const isPlan=formData.status==="planning";
  const secStatus=`<div class="acc-section"><div class="acc-header" onclick="toggleAcc('status')"><span class="acc-icon">📍</span><span class="acc-title">여행 상태</span><span class="acc-subtitle">${isPlan?"계획 중":"완료"}</span><span class="acc-chevron${accOpenSections.has("status")?" open":""}">▼</span></div><div class="acc-body${accOpenSections.has("status")?" open":""}"><div class="status-toggle"><button class="st-btn${isPlan?" plan-on":""}" onclick="setStatus('planning')">계획 중<small>기대 기록</small></button><button class="st-btn${!isPlan?" done-on":""}" onclick="setStatus('completed')">완료<small>현실 기록</small></button></div><div class="phase-note">${isPlan?"출발 전 기대를 기록하세요. 귀국 후 현실을 추가할 수 있어요.":"귀국 후 실제 경험을 기록하세요."}</div></div></div>`;
  const secBasic=`<div class="acc-section"><div class="acc-header" onclick="toggleAcc('basic')"><span class="acc-icon">✈️</span><span class="acc-title">기본 정보</span><span class="acc-subtitle">${formData.title||"제목 없음"}</span><span class="acc-chevron${accOpenSections.has("basic")?" open":""}">▼</span></div><div class="acc-body${accOpenSections.has("basic")?" open":""}"><div class="fi"><label>여행 제목</label><input value="${esc(formData.title)}" placeholder="예: 봄의 교토" oninput="formData.title=this.value"></div><div class="fi"><label>커버 이모지</label><div class="emoji-grid">${COVER_EMOJIS.map(e=>`<button class="eg-btn${formData.coverEmoji===e?" on":""}" onclick="formData.coverEmoji='${e}';renderForm()">${e}</button>`).join("")}</div></div><div class="fi-row"><div class="fi"><label>시작일</label><input type="date" value="${formData.startDate}" onchange="formData.startDate=this.value;calcDays()"></div><div class="fi"><label>종료일</label><input type="date" value="${formData.endDate}" onchange="formData.endDate=this.value;calcDays()"></div></div>${formData.totalDays?`<div style="font-size:.72rem;color:var(--gray);text-align:right;margin-top:-.3rem;margin-bottom:.5rem">총 ${formData.totalDays}일</div>`:""}</div></div>`;
  const cContent=formData.countries.length===0?`<div style="font-size:.8rem;color:var(--gray);padding:.2rem 0 .8rem">나라를 추가하고 기록을 작성하세요</div>`:formData.countries.map(c=>{
    const ent=formData.entries[c.code]||{cities:"",expect:"",reality:"",insight:"",memo:"",moods:[],score:7,photos:[]};
    const isOpen=accOpenSections.has("c_"+c.code);
    const photoGrid=ent.photos?.length?`<div class="photo-preview-grid">${ent.photos.map((p,i)=>`<div class="photo-preview-item"><img src="${p}" alt=""><button class="photo-del-btn" onclick="removeFormPhoto('${c.code}',${i})">✕</button></div>`).join("")}</div>`:"";
    const uploadBtn=`<div class="photo-upload-area" onclick="document.getElementById('fp-${c.code}').click()"><input type="file" id="fp-${c.code}" accept="image/*" multiple onchange="addFormPhotos('${c.code}',this.files)"><div class="pua-icon">📷</div><div class="pua-text"><strong>사진 추가</strong> · ${(ent.photos||[]).length}/5장</div></div>`;
    const moodBtns=ALL_MOODS.map(m=>`<button class="ms-btn${(ent.moods||[]).includes(m)?" on":""}" onclick="toggleMood('${c.code}','${m}')">${m}</button>`).join("");
    const realSec=!isPlan?`<div class="fi"><label>현실</label><textarea placeholder="실제로 경험한 것들..." oninput="updE('${c.code}','reality',this.value)">${esc(ent.reality||"")}</textarea></div><div class="fi"><label>디자인 영감</label><textarea placeholder="디자인·창작 영감..." oninput="updE('${c.code}','insight',this.value)">${esc(ent.insight||"")}</textarea></div><div class="fi"><label>메모</label><textarea placeholder="형식 없는 감상, 팁..." oninput="updE('${c.code}','memo',this.value)">${esc(ent.memo||"")}</textarea></div><div class="fi"><label>감정 태그</label><div class="mood-sel">${moodBtns}</div></div><div class="fi"><label>충족도 <span id="sv-${c.code}">${ent.score||7}</span>/10</label><div class="score-wrap"><input type="range" min="1" max="10" value="${ent.score||7}" oninput="updE('${c.code}','score',parseInt(this.value));document.getElementById('sv-${c.code}').textContent=this.value"></div></div>`:"";
    return `<div class="country-acc"><div class="country-acc-header" onclick="toggleCountryAcc('${c.code}')"><span class="cah-flag">${c.emoji}</span><span class="cah-name">${c.name}</span><span class="cah-status">${(ent.photos||[]).length?`📷${ent.photos.length} · `:""} ${ent.expect?"기대 ✓":"미입력"}</span><span class="cah-chevron${isOpen?" open":""}">▼</span></div><div class="country-acc-body${isOpen?" open":""}"><div class="fi"><label>방문 도시</label><input value="${esc(ent.cities||"")}" placeholder="예: 도쿄, 교토" oninput="updE('${c.code}','cities',this.value)"></div><div class="fi"><label>기대 (출발 전)</label><textarea placeholder="이 나라에서 기대하는 것들..." oninput="updE('${c.code}','expect',this.value)">${esc(ent.expect||"")}</textarea></div>${realSec}${photoGrid}${uploadBtn}</div></div>`;
  }).join("");
  const selC=formData.countries.map(c=>`<span class="sel-c">${c.emoji} ${c.name}<span onclick="removeC('${c.code}')">✕</span></span>`).join("");
  const secCountries=`<div class="acc-section"><div class="acc-header" onclick="toggleAcc('countries')"><span class="acc-icon">🌍</span><span class="acc-title">방문 나라</span><span class="acc-subtitle">${formData.countries.length?formData.countries.map(c=>c.emoji).join(""):"없음"}</span><span class="acc-chevron${accOpenSections.has("countries")?" open":""}">▼</span></div><div class="acc-body${accOpenSections.has("countries")?" open":""}"><div class="cs-wrap"><input class="cs-inp" id="cs-inp" placeholder="나라 검색 (예: 일본, France...)" oninput="showAC(this.value)" autocomplete="off"><div class="cs-dd" id="cs-dd"></div></div>${selC?`<div class="sel-countries">${selC}</div>`:""} ${cContent}</div></div>`;
  const secDel=editingId?`<div class="acc-section" style="border-color:rgba(255,127,60,.3)"><div style="padding:.7rem 1rem"><button class="del-btn" onclick="deleteTrip('${editingId}')">이 여행 기록 삭제</button></div></div>`:"";
  fb.innerHTML=secStatus+secBasic+secCountries+secDel;
}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function calcDays(){if(formData.startDate&&formData.endDate)formData.totalDays=Math.max(1,Math.ceil((new Date(formData.endDate)-new Date(formData.startDate))/86400000)+1);}
function showAC(q){const dd=document.getElementById("cs-dd");if(!q){dd.style.display="none";return;}const res=COUNTRIES.filter(c=>c.name.includes(q)||c.code.toLowerCase()===q.toLowerCase()).slice(0,8);let html=res.map(c=>`<div class="cs-item" onclick='addC(${JSON.stringify(c)})'>${c.emoji} <span>${c.name}</span></div>`).join("");if(!COUNTRIES.find(c=>c.name===q))html+=`<div class="cs-item" onclick="addC({code:'${q.slice(0,3).toUpperCase()}',name:'${q}',emoji:'🌍',continent:'unknown'})">🌍 <span>"${q}" 직접 추가</span></div>`;dd.innerHTML=html;dd.style.display="block";}
function addC(c){if(formData.countries.find(x=>x.code===c.code))return;formData.countries.push(c);if(!formData.entries[c.code])formData.entries[c.code]={cities:"",expect:"",reality:"",insight:"",memo:"",moods:[],score:7,photos:[]};accOpenSections.add("c_"+c.code);document.getElementById("cs-inp").value="";document.getElementById("cs-dd").style.display="none";renderForm();}
function removeC(code){formData.countries=formData.countries.filter(c=>c.code!==code);accOpenSections.delete("c_"+code);renderForm();}
function updE(code,f,val){if(!formData.entries[code])formData.entries[code]={cities:"",expect:"",reality:"",insight:"",memo:"",moods:[],score:7,photos:[]};formData.entries[code][f]=val;}
function toggleMood(code,m){if(!formData.entries[code])return;const ms=formData.entries[code].moods||[];formData.entries[code].moods=ms.includes(m)?ms.filter(x=>x!==m):[...ms,m];renderForm();}
async function addFormPhotos(code,files){if(!formData.entries[code])formData.entries[code]={cities:"",expect:"",reality:"",insight:"",memo:"",moods:[],score:7,photos:[]};const photos=formData.entries[code].photos||[];const rem=5-photos.length;if(rem<=0){showToast("최대 5장까지 가능해요");return;}for(const f of [...files].slice(0,rem))photos.push(await compressImage(f,800,.75));formData.entries[code].photos=photos;renderForm();}
function removeFormPhoto(code,idx){if(!formData.entries[code])return;formData.entries[code].photos.splice(idx,1);renderForm();}
async function saveTrip(){
  if(!formData.title.trim()){showToast("여행 제목을 입력해주세요.");return;}
  if(!formData.countries.length){showToast("방문 나라를 1개 이상 추가해주세요.");return;}
  if(!formData.startDate||!formData.endDate){showToast("여행 날짜를 입력해주세요.");return;}
  calcDays();
  const id=editingId||Date.now()+"_"+Math.random().toString(36).slice(2,5);
  const countries=formData.countries.map(c=>({...c,...(formData.entries[c.code]||{})}));
  const trip={id,status:formData.status,title:formData.title.trim(),coverEmoji:formData.coverEmoji,startDate:formData.startDate,endDate:formData.endDate,
    totalDays:formData.totalDays||0,countries,
    createdAt:editingId?(trips.find(t=>t.id===id)?.createdAt||new Date().toISOString()):new Date().toISOString(),
    updatedAt:new Date().toISOString()};
  trips=editingId?trips.map(t=>t.id===id?trip:t):[trip,...trips];
  await saveToFirestore(trip);renderAll();closeForm();showToast("저장됐어요!");
}
async function deleteTrip(id){if(!confirm("이 여행 기록을 삭제하시겠어요?"))return;trips=trips.filter(t=>t.id!==id);await delFromFirestore(id);renderAll();closeForm();showToast("삭제됐어요.");}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500);}
document.addEventListener("click",e=>{if(!e.target.closest(".cs-wrap"))document.querySelectorAll(".cs-dd").forEach(d=>d.style.display="none");});

// ── GLOBE ANIMATION ──
(function(){
  const lons=[0,1,2,3,4,5].map(i=>document.getElementById("lon"+i));
  const offsets=lons.map((_,i)=>i*Math.PI/6);
  const R=240,speed=0.004;let angle=0,rafId=null;
  const BLOBS=[{hx:440,hy:180,gx:330,gy:218,rx:[56,44,50,58],ry:[44,52,40,46],ph:0,delay:0},{hx:365,hy:168,gx:292,gy:232,rx:[28,34,24,30],ry:[22,18,26,24],ph:.9,delay:150},{hx:258,hy:162,gx:268,gy:228,rx:[42,36,46,40],ry:[34,40,30,36],ph:1.8,delay:280},{hx:155,hy:185,gx:272,gy:260,rx:[32,26,36,30],ry:[26,32,22,28],ph:2.7,delay:430},{hx:170,hy:295,gx:284,gy:270,rx:[24,28,20,26],ry:[20,16,24,22],ph:3.6,delay:90},{hx:300,hy:285,gx:308,gy:245,rx:[28,24,32,26],ry:[23,28,20,25],ph:4.5,delay:350},{hx:468,hy:345,gx:322,gy:255,rx:[22,18,26,20],ry:[18,22,14,20],ph:5.4,delay:210}];
  const bEls=BLOBS.map((_,i)=>document.getElementById("bl"+(i+1)));
  const globeSvg=document.querySelector(".globe-wrap svg");
  function getPulse(t){return(1-Math.cos((t/5000)*Math.PI*2))/2;}
  function pebblePath(cx,cy,t,b){const N=64,T=t*.0004+b.ph;const ki=(Math.sin(T)*.5+.5)*3;const k0=Math.floor(ki)%4,k1=(k0+1)%4,f=ki-Math.floor(ki);const brx=b.rx[k0]+(b.rx[k1]-b.rx[k0])*f,bry=b.ry[k0]+(b.ry[k1]-b.ry[k0])*f;const pts=[];for(let i=0;i<N;i++){const a=(i/N)*Math.PI*2;const r=1+.07*Math.sin(2*a+T*.6+b.ph)+.04*Math.sin(3*a-T*.4+b.ph*1.2)+.02*Math.cos(4*a+T*.25);pts.push([cx+brx*r*Math.cos(a),cy+bry*r*Math.sin(a)]);}let d=`M${pts[0][0].toFixed(2)},${pts[0][1].toFixed(2)}`;for(let i=0;i<N;i++){const p0=pts[(i-1+N)%N],p1=pts[i],p2=pts[(i+1)%N],p3=pts[(i+2)%N];const cp1x=p1[0]+(p2[0]-p0[0])/6,cp1y=p1[1]+(p2[1]-p0[1])/6,cp2x=p2[0]-(p3[0]-p1[0])/6,cp2y=p2[1]-(p3[1]-p1[1])/6;d+=`C${cp1x.toFixed(2)},${cp1y.toFixed(2)} ${cp2x.toFixed(2)},${cp2y.toFixed(2)} ${p2[0].toFixed(2)},${p2[1].toFixed(2)}`;}return d+"Z";}
  function tick(){angle+=speed;const t=performance.now();const baseS=((s)=>s*s*(3-2*s))(getPulse(t));if(globeSvg)globeSvg.style.transform=`scale(${1+baseS*.06})`;lons.forEach((el,i)=>{if(!el)return;const a=angle+offsets[i];el.setAttribute("rx",Math.abs(Math.cos(a)*R).toFixed(2));el.setAttribute("stroke-opacity",Math.cos(a)>=0?".8":".25");});BLOBS.forEach((b,i)=>{if(!bEls[i])return;const s=((r)=>r*r*(3-2*r))(getPulse(t-b.delay));const cx=b.gx+(b.hx-b.gx)*s,cy=b.gy+(b.hy-b.gy)*s;bEls[i].setAttribute("d",pebblePath(cx,cy,t,b));});rafId=requestAnimationFrame(tick);}
  const obs=new MutationObserver(()=>{const h=document.getElementById("landing").classList.contains("hidden");if(h&&rafId){cancelAnimationFrame(rafId);rafId=null;}else if(!h&&!rafId)tick();});
  obs.observe(document.getElementById("landing"),{attributes:true,attributeFilter:["class"]});
  tick();
})();

const s1=document.createElement("script");s1.src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js";
const s2=document.createElement("script");s2.src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js";
const s3=document.createElement("script");s3.src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js";
s1.onload=()=>document.head.appendChild(s2);s2.onload=()=>document.head.appendChild(s3);
s3.onload=()=>{initFirebase();};document.head.appendChild(s1);
</script>
